<style>
/* Hanken Grotesk ships with the page (fonts/, SIL OFL). */
@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk-latin.woff2") format("woff2");
  font-weight: 400 600;
  font-display: swap;

}
@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk-latin-ext.woff2") format("woff2");
  font-weight: 400 600;
  font-display: swap;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

/* Plain greys and one colour: a near-black page (pale grey by day), one lighter
   grey for every card on it, blue for the thing to press and the value that's
   set. Green is free, amber is maybe, grey is busy. Buttons are pills lit a
   little from above; the round ones in a header are flat discs. */
:root {
  --bg: #F0F1F3;
  --surface: #FFFFFF;
  --ink: #17181B;
  --muted: #5F6168;
  --faint: #696B72;
  --line: #E1E2E6;
  --line-strong: #8D8F96;
  --accent: #2C53C4;
  --pos: #1D7548;
  --neg: #B0392D;
  --mid: #8F5E0E;
  --off: #5F6168;
  --on-ink: #FFFFFF;
  --key: #D6D8DE;
  --key-hi: #E4E5EA;
  --key-down: #C6C8CF;
  --pop: #FFFFFF;
  --pop-line: rgba(0, 0, 0, .06);
  --disc: #FFFFFF;
  --disc-edge: inset 0 0 0 1px rgba(0, 0, 0, .05), 0 2px 6px rgba(0, 0, 0, .08);
  --rim: inset 0 0 0 1px rgba(0, 0, 0, .04), inset 0 1px 0 rgba(255, 255, 255, .6);
  --lift: 0 1px 3px rgba(0, 0, 0, .12);
  --backdrop: rgba(12, 13, 16, .4);
  --font: "Hanken Grotesk", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171719;
    --surface: #2F2F2F;
    --ink: #EAEAEA;
    --muted: #A0A0A3;
    --faint: #949497;
    --line: #434345;
    --line-strong: #6E6E72;
    --accent: #85A2FF;
    --pos: #5FC890;
    --neg: #F08476;
    --mid: #E3B25C;
    --off: #A0A0A3;
    --on-ink: #171719;
    --key: #303132;
    --key-hi: #47484A;
    --key-down: #555658;
    --pop: #121213;
    --pop-line: rgba(255, 255, 255, .14);
    --disc: #252526;
    --disc-edge: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 4px 10px rgba(0, 0, 0, .35);
    --rim: inset 0 0 0 1px rgba(255, 255, 255, .05), inset 0 1px 0 rgba(255, 255, 255, .1);
    --lift: 0 2px 5px rgba(0, 0, 0, .35);
    --backdrop: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171719;
  --surface: #2F2F2F;
  --ink: #EAEAEA;
  --muted: #A0A0A3;
  --faint: #949497;
  --line: #434345;
  --line-strong: #6E6E72;
  --accent: #85A2FF;
  --pos: #5FC890;
  --neg: #F08476;
  --mid: #E3B25C;
  --off: #A0A0A3;
  --on-ink: #171719;
  --key: #303132;
  --key-hi: #47484A;
  --key-down: #555658;
  --pop: #121213;
  --pop-line: rgba(255, 255, 255, .14);
  --disc: #252526;
  --disc-edge: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 4px 10px rgba(0, 0, 0, .35);
  --rim: inset 0 0 0 1px rgba(255, 255, 255, .05), inset 0 1px 0 rgba(255, 255, 255, .1);
  --lift: 0 2px 5px rgba(0, 0, 0, .35);
  --backdrop: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-block: calc(8px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.muted { color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Top bar: a round Back with the name beside it, then a round button at the right */
.top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; margin-bottom: -6px; }
.top-when { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-right { display: flex; align-items: center; gap: 10px; flex: none; }
.mark { min-width: 0; font-size: 1.35rem; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.top > .mark { padding-left: 6px; }
a.mark { line-height: 44px; }
.icon-btn {
  position: relative; flex: none; display: grid; place-items: center;
  width: 44px; height: 44px; padding: 0;
  background: var(--disc); border: 0; border-radius: 50%; box-shadow: var(--disc-edge); color: var(--ink);
}
.icon-btn:active { background: var(--key-down); }
/* A group's name has how many are in it on a small line beneath */
.top-title { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.top-title .mark { line-height: 1.2; }
.mark-n { font-size: .84rem; line-height: 1.3; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { margin: -10px 6px -6px; font-size: .86rem; color: var(--muted); }

/* More: a small panel that drops from under its button, a picture and a word for each thing */
.scrim { position: fixed; inset: 0; z-index: 4; }
.menu { position: absolute; z-index: 5; top: calc(100% + 4px); right: 0; min-width: 192px; max-width: 100%; padding: 9px 8px; background: var(--pop); border: 1px solid var(--pop-line); border-radius: 28px; box-shadow: 0 12px 32px rgba(0, 0, 0, .4); transform-origin: top right; }
.menu-row { display: flex; align-items: center; gap: 15px; width: 100%; min-height: 46px; padding: 0 20px 0 16px; background: none; border: 0; border-radius: 18px; font-size: 1.06rem; text-align: left; white-space: nowrap; }
.menu-row:active { background: var(--key); }
@media (hover: hover) { .menu-row:hover { background: var(--key); } }
.menu-row svg { flex: none; width: 22px; height: 22px; }
.menu-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* Buttons: pills. The one that carries the screen on is blue; the rest are grey keys. */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center;
  min-height: 52px; padding: 0 22px; border: 0; border-radius: 99px;
  font-size: 1rem; font-weight: 500; text-decoration: none;
  background: var(--accent); color: var(--on-ink);
}
.btn:active { opacity: .85; }
.btn.ghost { background: linear-gradient(var(--key-hi), var(--key)); box-shadow: var(--rim); color: var(--ink); }
.btn.ghost:active { background: var(--key-down); opacity: 1; }
.btn.wide { width: 100%; }
.link { position: relative; appearance: none; padding: 6px 0; background: none; border: 0; font-size: .92rem; font-weight: 500; color: var(--accent); text-decoration: none; }
/* Text buttons stay small on screen but take a full-size tap */
.link::after { content: ""; position: absolute; inset: -9px -6px; }
.link.quiet { color: var(--muted); }
.link.danger { color: var(--neg); }
.ev-foot { display: flex; align-items: center; gap: 16px; margin-top: -2px; }
.ev-foot .ev-del { margin-left: auto; }

/* Sections and cards */
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: 30px; padding: 0 6px; }
.sec-head h2 { font-size: 1rem; font-weight: 500; }
.sec-head .muted { font-size: .9rem; }
.sec-side { display: flex; align-items: center; gap: 10px; }
/* A weekend's five slots as bars: the taller, the more of the group is free. */
.sky { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
.sky i { position: relative; width: 5px; height: 100%; border-radius: 2px; background: color-mix(in srgb, var(--ink) 14%, transparent); overflow: hidden; }
.sky i.gap { margin-left: 3px; }
.sky i.past { opacity: .45; }
.sky b { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 2px; background: var(--pos); transform-origin: bottom; }
.card { background: var(--surface); border-radius: 24px; }
.empty { padding: 2px 6px 0; font-size: .92rem; color: var(--muted); }
.more-weeks { padding: 0 6px; }

/* A few things to pick from, in one pill-shaped track: what's picked is a raised key, the rest lie flat */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; padding: 3px; background: var(--bg); border-radius: 99px; }
.seg button {
  position: relative; appearance: none; min-height: 44px; padding: 0 4px; border: 0; border-radius: 99px;
  background: none; font-size: .86rem; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: linear-gradient(var(--key-hi), var(--key)); box-shadow: var(--rim), var(--lift); color: var(--ink); }
.seg button:focus-visible { outline-offset: -3px; }
.seg small { font-size: .8rem; font-weight: 400; margin-left: 5px; }

/* Your answer: a knob you drag, or tap, to one of three stops. Until you
   answer there is no knob, only the empty track and its three words. */
.slide {
  --p: 1; position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px;
  background: var(--bg); border-radius: 99px;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.slide[data-pos="0"] { --p: 0; --knob: var(--pos); }
.slide[data-pos="1"] { --knob: var(--mid); }
.slide[data-pos="2"] { --p: 2; --knob: var(--off); }
.knob {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 99px;
  background: var(--knob, transparent); transform: translateX(calc(var(--p) * 100%));
  transition: transform .24s cubic-bezier(.3, 1.2, .4, 1), background-color .15s;
}
.slide:not([data-pos="-"]) .knob { box-shadow: var(--rim), var(--lift); }
.slide.drag .knob, .slide.still .knob { transition: background-color .15s; }
.slide.drag { cursor: grabbing; }
.slide button {
  position: relative; appearance: none; min-height: 44px; padding: 0 2px; border: 0; border-radius: 99px;
  background: none; font-size: .86rem; font-weight: 500; color: var(--muted); white-space: nowrap; transition: color .15s;
}
.slide[data-pos="0"] button:nth-of-type(1), .slide[data-pos="1"] button:nth-of-type(2), .slide[data-pos="2"] button:nth-of-type(3) { color: var(--on-ink); }
.slide button:focus-visible { outline-offset: -2px; }
.slide small { font-size: .8rem; font-weight: 400; margin-left: 4px; }

/* A weekend: one row for each night and day, a hairline between them. The words,
   the track, the hairline and the names all keep to one edge each side (--edge),
   the same one an event card keeps. */
.card { --edge: 18px; }
.slot { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) clamp(150px, 44vw, 174px); align-items: center; gap: 0 10px; padding: 10px var(--edge) 10px 0; }
.slot + .slot::before { content: ""; position: absolute; top: 0; left: var(--edge); right: var(--edge); border-top: 1px solid var(--line); }
.slot-info { appearance: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; min-height: 44px; padding: 0 0 0 var(--edge); background: none; border: 0; text-align: left; align-content: center; }
.slot-name { display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; font-weight: 500; }
.slot-name svg { color: var(--muted); transition: transform .15s; }
.slot-info[aria-expanded="true"] .slot-name svg { transform: rotate(180deg); }
.slot-n { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; font-size: .86rem; color: var(--muted); }
/* One block a person: green free, amber maybe, grey busy, pale no answer */
.pips { flex: none; display: block; fill: var(--line); }
.pips .f { fill: var(--pos); } .pips .m { fill: var(--mid); } .pips .b { fill: var(--line-strong); }
.slot-n b { display: inline-block; font-weight: 500; color: var(--ink); }
.slot-n.all { flex-wrap: nowrap; min-width: 0; color: var(--pos); font-weight: 500; white-space: nowrap; }
.slot-n.all > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top-slot { font-size: .8rem; font-weight: 500; color: var(--pos); }
/* Everyone can come: a dot that keeps ringing. */
.live { position: relative; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--pos); }
.live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--pos); animation: ring 2.4s ease-out infinite; }
@keyframes ring { from { opacity: .55; transform: scale(1); } 70%, to { opacity: 0; transform: scale(3.2); } }
.who-box { grid-column: 1 / -1; display: grid; justify-items: start; gap: 8px; padding: 6px 0 6px var(--edge); }

/* Everyone by name, and how they answered: filled is yes, dashed is maybe,
   struck through is no, plain grey hasn't said. */
.roster { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; margin: 0; padding: 0; list-style: none; }
.roster li { display: inline-flex; align-items: baseline; gap: 5px; max-width: 100%; min-height: 28px; padding: 3px 11px; border: 1px solid transparent; border-radius: 99px; font-size: .86rem; line-height: 20px; white-space: nowrap; }
.roster .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.roster .in { background: color-mix(in srgb, var(--pos) 16%, var(--surface)); }
.roster .maybe { border: 1px dashed color-mix(in srgb, var(--mid) 75%, var(--surface)); }
.roster .out { padding-inline: 5px; color: var(--muted); }
.roster .out .nm { text-decoration: line-through; text-decoration-color: var(--line-strong); }
.roster .none { padding-inline: 5px; color: var(--muted); }
.roster .me { font-weight: 500; }
.roster small { font-size: .78rem; font-weight: 400; color: var(--muted); }
.roster .more { padding: 0; }
.roster .more button { position: relative; appearance: none; min-height: 28px; padding: 0 9px; background: none; border: 0; font-size: .86rem; font-weight: 500; color: var(--accent); }
/* Small on screen, a full-size tap */
.roster .more button::after { content: ""; position: absolute; inset: -8px -6px; }
/* A narrow phone: a tighter edge and a narrower track, so a row's words stay on their line */
@media (max-width: 350px) {
  .card { --edge: 14px; }
  .slot { grid-template-columns: minmax(0, 1fr) 144px; gap: 0 8px; }
  .slot-name { gap: 0 4px; }
  .top-slot { font-size: .74rem; }
  .slide button { font-size: .8rem; }
  .pips { width: 44px; }
  .slot-n.all { gap: 5px; font-size: .8rem; }
}

/* Events: the date in a square, what's on beside it, then your answer and who's coming */
.events { display: grid; gap: 12px; }
.ev { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 18px var(--edge); overflow: hidden; }
.ev-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; }
.ev-date { display: grid; justify-items: center; align-content: center; min-width: 52px; height: 52px; padding: 0 8px; border-radius: 16px; background: var(--bg); line-height: 1; }
.ev-date b { font-size: 1.3rem; font-weight: 400; letter-spacing: -.02em; }
.ev-date.wide b { font-size: 1rem; }
.ev-date span { margin-top: 4px; font-size: .74rem; color: var(--muted); }
/* Today's is in blue */
.ev-date.now b { color: var(--accent); }
.ev-when { font-size: .88rem; color: var(--muted); }
.ev-title { font-size: 1.125rem; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.ev-tear { display: none; }
/* The parts you can make: a track as wide as the answer above it */
.ev-part { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.ev-part > span { font-size: .88rem; color: var(--muted); }
.ev-part .seg button { min-height: 38px; font-size: .86rem; }
/* Small on screen, a full-size tap */
.ev-part .seg button::before { content: ""; position: absolute; inset: -4px 0; }

/* Sheets: one rounded panel that rises from the foot, a round button to shut it */
.backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 10; }
.sheet {
  --field: var(--bg);
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; margin: 0 auto; max-width: 600px; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 0; border-radius: 28px 28px 0 0; outline: 0;
}
.sheet.rise { animation: rise .26s cubic-bezier(.2, .9, .3, 1); }
.backdrop.rise { animation: dim .2s; }
@keyframes rise { from { transform: translateY(28px); opacity: 0; } }
@keyframes dim { from { opacity: 0; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 62px; padding: 14px 14px 4px 26px; }
.sheet-head h2 { min-width: 0; font-size: 1.2rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 10px max(20px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.hint { padding: 0 6px; font-size: .9rem; color: var(--muted); }

.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.field-label { padding: 0 6px; font-size: .9rem; color: var(--muted); }
/* A field is a rounded well: white on the page, the page's grey on a sheet */
input[type=text], select {
  width: 100%; min-height: 52px; padding: 0 16px; background: var(--field, var(--surface)); color: var(--ink);
  border: 0; border-radius: 18px; font-size: 16px;
}
input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
/* A list to choose from looks like the fields beside it, with its own arrow at the right */
select { appearance: none; -webkit-appearance: none; padding-right: 44px; text-overflow: ellipsis; }
.select { position: relative; display: block; }
.select svg { position: absolute; top: 50%; right: 16px; width: 14px; height: 14px; margin-top: -7px; color: var(--muted); pointer-events: none; }
input::placeholder { color: var(--muted); opacity: 1; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.seg.five { border-radius: 29px; }
.seg.five button { min-height: 52px; border-radius: 26px; line-height: 1.2; white-space: normal; }
.seg.five button:disabled { opacity: .35; cursor: default; }

/* A grouped list: one rounded card, a row for each thing, a hairline between rows */
.people { padding: 0 20px; background: var(--surface); border-radius: 24px; }
.person { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; font-size: 1.125rem; line-height: 1.3; }
.person + .person { border-top: 1px solid var(--line); }
.person span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person em { font-style: normal; color: var(--muted); font-size: .9rem; }
.person .link { flex: none; }
.foot-links { display: grid; padding: 0 20px; background: var(--surface); border-radius: 24px; }
.foot-links .link { display: flex; align-items: center; min-height: 56px; padding: 8px 0; font-size: 1.125rem; font-weight: 400; line-height: 1.3; text-align: left; }
.foot-links .link + .link { border-top: 1px solid var(--line); }
.foot-links .link::after { inset: 0 -20px; }
.foot-links .link.quiet { color: var(--ink); }

/* Home and joining */
.lead { max-width: 21ch; font-size: 1.75rem; font-weight: 400; line-height: 1.2; letter-spacing: -.015em; overflow-wrap: anywhere; }
.lead + p { margin-top: 10px; color: var(--muted); max-width: 34ch; }
form.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }

/* First run: one question a screen. The screen fills the phone so the way on,
   and the small print, sit at the foot. */
.onb { display: flex; flex-direction: column; gap: 22px; min-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.onb .lead { max-width: 20ch; margin: 8px 6px 0; text-wrap: balance; }
.onb .ask { padding: 0 6px; font-size: 1.75rem; font-weight: 400; line-height: 1.2; letter-spacing: -.015em; }
.onb form.stack { gap: 14px; }
.onb form.stack input { min-height: 56px; font-size: 18px; }
.onb .end { margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.inv .kick { margin: 8px 0 2px; padding: 0 6px; font-size: 1rem; color: var(--muted); }
.inv .ask { overflow-wrap: anywhere; }
.inv .who { margin-top: 8px; padding: 0 6px; color: var(--muted); overflow-wrap: anywhere; }
.inv .wk-cap { padding: 0 8px; font-size: .9rem; color: var(--muted); }
.inv .wk-say.none { font-weight: 400; color: var(--muted); }
.inv .wk-say.none::before { background: var(--line-strong); }
.inv .end { gap: 14px; }
.inv .mine { display: grid; gap: 10px; padding-top: 6px; }
.inv .mine p { padding: 0 6px; font-size: .9rem; color: var(--muted); }
.inv .names .btn { min-height: 44px; padding: 0 18px; font-size: .95rem; }
.inv .legal { margin-top: -4px; }
.onb .groups-acts { grid-template-columns: 1fr 1fr; }
.onb .groups-acts .btn { padding: 0 10px; }
/* A step sits at the top, under its question, so the keyboard clears it. */
.onb .mid { flex: 1; display: flex; flex-direction: column; gap: 20px; padding-top: 8px; }
.bad { padding: 0 6px; color: var(--neg); font-size: .9rem; }
/* A join code: four letters, typed into one field drawn as four boxes. */
.code-in { position: relative; display: block; }
.code-in input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 18px; }
.cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.cells i { display: grid; place-items: center; height: 72px; font-style: normal; font-size: 2rem; font-weight: 400; background: var(--field, var(--surface)); border-radius: 20px; }
.code-in:focus-within .cells i.at { box-shadow: inset 0 0 0 2px var(--accent); }
.btn:disabled { opacity: .4; }
.invite-foot { display: flex; justify-content: center; }

/* A weekend in miniature: a bar a friend for each slot, and the slot that suits everyone. */
.wk { display: grid; gap: 14px; padding: 18px 12px 18px; background: var(--surface); border-radius: 24px; }
.wk-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.wk-col { display: grid; gap: 6px; padding: 10px 6px; border: 1.5px solid transparent; border-radius: 14px; }
.wk-col.best { border-color: var(--ink); }
.wk-col b { display: block; margin-bottom: 4px; font-size: .76rem; font-weight: 500; line-height: 1.25; text-align: center; }
.wk-col b span { display: block; font-weight: 400; color: var(--muted); }
.wk-col i { height: 16px; border-radius: 5px; background: var(--line); animation: wk-in .45s both; animation-delay: calc(var(--c) * 80ms + var(--r) * 40ms + 120ms); }
.wk-col i.f { background: var(--pos); }
.wk-col i.m { background: var(--mid); }
.wk-say { display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: .92rem; font-weight: 500; }
.wk-say::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--pos); }
@keyframes wk-in { from { opacity: 0; transform: scaleX(.4); } }

/* Two tiles, one under the other: the choice is the page. */
.pick { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.pick button { appearance: none; display: grid; justify-items: center; gap: 4px; padding: 30px 18px 28px; text-align: center; color: var(--ink); background: var(--surface); border: 0; border-radius: 24px; }
.pick button:active { background: var(--key); }
.pick .ic { display: grid; place-items: center; width: 54px; height: 54px; margin-bottom: 12px; border-radius: 50%; background: linear-gradient(var(--key-hi), var(--key)); box-shadow: var(--rim); color: var(--ink); }
.pick .ic svg { width: 24px; height: 24px; }
/* Join shows what a code looks like. */
.pick .eg { display: flex; align-items: center; gap: 6px; height: 54px; margin-bottom: 12px; }
.pick .eg i { display: grid; place-items: center; width: 36px; height: 44px; font-style: normal; font-size: 1.1rem; font-weight: 500; color: var(--muted); border-radius: 12px; background: var(--bg); }
.pick strong { display: block; font-size: 1.25rem; font-weight: 400; line-height: 1.25; letter-spacing: -.01em; }
.pick small { display: block; font-size: .95rem; color: var(--muted); }

/* A group on the home screen: its weekend at a glance. */
.gcards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.gcard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 18px 12px 18px; background: var(--surface); border-radius: 24px; text-decoration: none; color: var(--ink); }
.gcard:active { background: var(--key); }
.gcard-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 8px; }
/* How many and when as the small label, the group's name large under it */
.gcard-head > span { display: flex; flex-direction: column-reverse; min-width: 0; }
.gcard-head strong { display: block; font-size: 1.4rem; font-weight: 400; line-height: 1.25; letter-spacing: -.015em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gcard-head small { display: block; font-size: .9rem; color: var(--muted); }
.gcard-head svg { flex: none; color: var(--line-strong); }
.gcard .wk-col i { height: 10px; border-radius: 3px; animation-duration: .35s; animation-delay: calc(var(--c) * 45ms + var(--r) * 20ms + 60ms); }
.gcard .wk-say.none { font-weight: 400; color: var(--muted); }
.gcard .wk-say.none::before { background: var(--line-strong); }

.legal { margin-top: 4px; padding: 10px 0; text-align: center; font-size: .8rem; color: var(--muted); }
.legal a { position: relative; color: inherit; }
/* Small on screen, a full-size tap */
.legal a::after { content: ""; position: absolute; inset: -14px -8px; }
/* A page of its own (About, You and the group): it fills the screen and Back leaves it */
.sheet.page { --field: var(--surface); top: 0; max-width: none; max-height: none; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); border-radius: 0; background: var(--bg); }
.sheet.page.rise { animation: dim .18s; }
.sheet.page > * { width: 100%; max-width: 600px; margin-inline: auto; }
.sheet-head.back { justify-content: flex-start; min-height: 56px; margin-top: 8px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head.back h2 { font-size: 1.35rem; letter-spacing: -.01em; line-height: 1.3; }
.sheet.page .sheet-body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet.page .about-foot { margin-top: auto; }
/* Room under the last row, so a message at the foot of the screen never sits on it */
.sheet.page .sheet-body.foot-room { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
/* About: who this is, then rounded lists, a row for each thing, with a hairline between them */
.about-id { display: grid; justify-items: center; gap: 4px; padding: 14px 0 10px; text-align: center; }
.about-id img { margin-bottom: 10px; border-radius: 15px; }
.about-id p, .about-foot { margin: 0; }
.about-name { font-size: 1.4rem; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; }
.about-tag { color: var(--muted); }
.about-links { display: grid; padding: 0 20px; background: var(--surface); border-radius: 24px; }
.about-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; margin: 0; padding: 8px 0; font-size: 1.125rem; line-height: 1.3; color: var(--ink); text-align: left; text-decoration: none; }
.about-row + .about-row { border-top: 1px solid var(--line); }
.about-row > span { min-width: 0; overflow-wrap: anywhere; }
.about-row small { display: block; font-size: .9rem; font-variant-numeric: tabular-nums; color: var(--muted); }
a.about-row::after { content: ""; flex: none; width: 9px; height: 9px; margin-right: 3px; border: solid var(--line-strong); border-width: 1.5px 1.5px 0 0; transform: rotate(45deg); }
.about-foot { padding-top: 16px; text-align: center; font-size: .8rem; color: var(--muted); }
/* Nothing to show: what went wrong in a line or two, and the way on */
.lone { display: grid; gap: 10px; justify-items: start; margin-top: 8px; padding: 0 6px; }
.lone h1 { font-size: 1.5rem; font-weight: 400; line-height: 1.25; letter-spacing: -.01em; }
.lone p { color: var(--muted); }
.lone .btn { margin-top: 12px; }

#toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--on-ink); border-radius: 22px; padding: 11px 18px; font-size: .92rem; font-weight: 500; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .15s; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<script src="lib.js?v=2"></script>
<script>
if ('serviceWorker' in navigator && !window.musterApp) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
<script>
(() => {
  const L = Muster;
  const app = document.getElementById('app'), sheetRoot = document.getElementById('sheet'), toastEl = document.getElementById('toast');
  const WEEKS = 8;

  // Inside the iPhone app the pages come with the app, and the app lends what a
  // page can't do alone: the share sheet, a tick under the thumb, reminders.
  const shell = window.musterApp || null;
  const SITE = shell ? 'https://muster.teloone.au' : location.origin;
  const API = shell ? SITE : '';
  const tell = m => shell.postMessage(JSON.stringify(m));

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rid = () => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const clean = (s, max) => String(s || '').replace(/\s+/g, ' ').trim().slice(0, max);
  const ls = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  const GEAR = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h9M16 6h1M3 14h1M8 14h9"/><circle cx="14" cy="6" r="2"/><circle cx="6" cy="14" r="2"/></svg>';
  const BACK = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12h-17M10.5 5 3.5 12l7 7"/></svg>';
  const DOTS = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="currentColor"><circle cx="10" cy="3.6" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="10" cy="16.4" r="1.7"/></svg>';
  const SHUT = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"/></svg>';
  const INFO = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.7" r=".5" fill="currentColor"/></svg>';
  const ADD = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.7"/><path d="M3.5 19.5c.7-3.3 3.2-5.2 6.5-5.2 1.5 0 2.8.4 3.9 1.1M18.5 13.5v6M15.5 16.5h6"/></svg>';
  const DOWN = '<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>';
  const ANSWERS = [['f', 'Free'], ['m', 'Maybe'], ['b', 'Busy']];
  const REPLIES = [['in', 'Going'], ['maybe', 'Maybe'], ['out', 'No']];

  let saved = ls.get('muster.groups', []);
  let G = null;            // the open group: { id, me, state, queue, gone, failed, offline }
  let ui = { open: {}, more: false, menu: false, sheet: null, confirm: null };
  let view = '', drawn = null;

  // ---- Keeping in step with the server ----

  const persist = g => { ls.set('muster.g.' + g.id, { state: g.state, queue: g.queue }); plan(); };
  function remember(g) {
    const at = saved.findIndex(s => s.id === g.id);
    const row = { id: g.id, name: g.state ? g.state.group.name : (at >= 0 ? saved[at].name : ''), me: g.me };
    if (at >= 0) saved[at] = row; else saved.unshift(row);
    ls.set('muster.groups', saved);
    plan();
  }

  function forget(id) { saved = saved.filter(s => s.id !== id); ls.set('muster.groups', saved); ls.del('muster.g.' + id); plan(); }

  // The Thursday reminder, in the iPhone app. The phone shows it by itself: one
  // for each weekend ahead you haven't fully answered, at 6 the evening before.
  const remindOn = () => !!ls.get('muster.remind', false);
  // Notifications were refused: only the phone's Settings can turn them back on.
  let remindBlocked = false;
  let planned = '';
  function plan() {
    if (!shell) return;
    const items = [], now = Date.now();
    if (remindOn()) {
      const mine = saved.map(g => ({ g, c: ls.get('muster.g.' + g.id, null) })).filter(x => x.g.me && x.c && x.c.state);
      for (const w of L.weeks(new Date(), WEEKS)) {
        const at = L.parse(L.addDays(w, -1)); at.setHours(18, 0, 0, 0);
        if (at.getTime() <= now) continue;
        const open = mine.find(x => (((x.c.state.marks || {})[x.g.me] || {})[w] || L.BLANK).includes('-'));
        if (open) items.push({ id: 'weekend-' + w, at: at.getTime(), title: open.g.name || 'Muster', body: "Mark when you're free this weekend.", open: '/g/' + open.g.id });
      }
    }
    const next = JSON.stringify(items);
    if (next === planned) return;
    planned = next;
    tell({ type: 'notify', items });
  }

  // Changes go a slice at a time, so a long list made offline never asks too much of one request.
  const SLICE = 40;
  // The iPhone app gives the page a little longer to send when it goes out of sight.
  let owing = null;
  function owe() {
    if (!shell) return;
    const on = !!(G && G.id && G.queue.length && !G.gone && !G.left);
    if (on !== owing) { owing = on; tell({ type: 'unsent', on }); }
  }

  let busy = false, fails = 0, again = 0;
  async function sync() {
    if (!G || !G.id || busy) return;
    const g = G;
    busy = true;
    clearTimeout(again);
    let ok = false;
    try {
      const sending = g.queue.slice(0, SLICE);
      const res = sending.length
        ? await fetch(`${API}/api/g/${g.id}/ops`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ops: sending }) })
        : await fetch(`${API}/api/g/${g.id}`, { cache: 'no-store', headers: g.state && g.state.group.version ? { 'If-None-Match': `"${g.state.group.version}"` } : {} });
      if (res.status === 304) {
        ok = true;
      } else if (res.ok) {
        const fresh = await res.json();
        g.queue = g.queue.slice(sending.length);
        g.queue.forEach(op => L.applyOp(fresh, op));
        g.state = fresh;
        ok = true;
        if (!g.left) { persist(g); if (g.me) remember(g); }
      } else if (res.status === 404) {
        g.gone = true; g.queue = []; ok = true; forget(g.id);
      } else if (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429 && sending.length) {
        // The server won't take these: drop them rather than jam the queue.
        g.queue = g.queue.slice(sending.length); if (!g.left) persist(g); ok = true;
      } else throw new Error(String(res.status));
    } catch (e) {
      g.failed = true;
    }
    busy = false;
    if (g !== G) return sync();
    owe();
    const was = g.offline;
    g.offline = !ok;
    if (ok) { fails = 0; g.failed = false; } else { fails = Math.min(fails + 1, 5); again = setTimeout(sync, 1500 * 2 ** fails); }
    refresh(was !== g.offline);
    if (ok && g.queue.length) sync();
  }

  // A change: shown at once, kept until the server has it.
  function push(...ops) {
    ops.forEach(op => L.applyOp(G.state, op));
    G.queue.push(...ops);
    persist(G);
    owe();
    sync();
  }

  setInterval(() => { if (!document.hidden && G) sync(); }, 20000);
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && G) { sync(); refresh(); } });
  window.addEventListener('online', () => sync());

  // ---- Which screen ----

  function route() {
    const m = location.pathname.match(/^\/g\/([A-Za-z0-9_-]{22})\/?$/);
    const j = location.pathname.match(/^\/j\/([A-Za-z]{4})\/?$/);
    ui = { open: {}, more: false, menu: false, sheet: null, confirm: null };
    // A join code's short link: find its group, then carry on as if its link had been opened.
    if (j) { G = { id: '', code: j[1].toUpperCase(), me: null, state: null, queue: [] }; seek(); }
    // A group link that's the wrong length: say so, rather than show the home screen.
    else if (!m && /^\/[gj]\//.test(location.pathname)) G = { id: '', me: null, state: null, queue: [], gone: true, why: location.pathname[1] === 'j' ? 'none' : '' };
    else if (!m) { G = null; }
    else {
      const id = m[1], s = saved.find(x => x.id === id), c = ls.get('muster.g.' + id, null);
      G = { id, me: s ? s.me : null, state: c ? c.state : null, queue: c && c.queue ? c.queue : [] };
      sync();
    }
    view = '';
    owe();
    render();
    renderSheet();
    window.scrollTo(0, 0);
  }
  // The group a join code leads to.
  async function find(code) {
    try {
      const res = await fetch(`${API}/api/code/${code}`, { cache: 'no-store' });
      if (res.ok) return { id: (await res.json()).id };
      return { err: res.status === 404 ? 'none' : res.status === 429 ? 'many' : 'net' };
    } catch (e) { return { err: 'net' }; }
  }
  async function seek() {
    const g = G, r = await find(g.code);
    if (g !== G) return;
    if (r.id) { history.replaceState(null, '', '/g/' + r.id); path = location.pathname; return route(); }
    if (r.err === 'net') g.failed = true; else { g.gone = true; g.why = r.err; }
    render();
  }
  let path = location.pathname;
  function go(to) { history.pushState(null, '', to); path = location.pathname; route(); }
  // Back closes an open sheet and stays on the board.
  window.addEventListener('popstate', () => {
    if (location.pathname === path) {
      if (ui.sheet) { ui.sheet = null; ui.confirm = null; renderSheet(); }
      else if (!G) { ui.bad = false; ui.code = ''; render(); window.scrollTo(0, 0); }
      return;
    }
    path = location.pathname; route();
  });

  const kind = () => !G ? 'home' : G.gone ? 'gone' : !G.state ? (G.failed ? 'failed' : 'loading') : (!G.me || !L.member(G.state, G.me)) ? 'join' : 'board';
  // After news from the server: redraw the board, but leave a form someone may be typing in.
  function refresh(force) {
    const k = kind();
    if (k !== view || k === 'board' || force && k !== 'home' && k !== 'join') render();
    // An open sheet keeps up too, unless someone is typing or choosing in it.
    const at = document.activeElement;
    if (ui.sheet && view === 'board' && !(at && sheetRoot.contains(at) && /^(INPUT|TEXTAREA|SELECT)$/.test(at.tagName))) renderSheet(true);
  }

  function render() {
    view = kind();
    document.title = G && G.state ? `${G.state.group.name} · Muster` : 'Muster';
    if (view !== 'board' && ui.sheet && ui.sheet.kind !== 'about') { ui.sheet = null; renderSheet(); }
    const html = ({ home, gone, failed, loading, join, board })[view]();
    // Nothing new: leave the page alone, so focus and half-typed names survive.
    if (html === drawn) return;
    drawn = html;
    const was = stage, old = snap();
    stage = view + '|' + (view === 'home' ? step() : G ? G.id : '');
    app.innerHTML = html;
    move(old, stage !== was);
  }

  // ---- Movement ----
  // The page is drawn afresh each time, so what moves is worked out from where
  // each named piece (data-k) sat before and sits now: a piece that changed
  // place slides there, a new one arrives, a changed one shows it.
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const EASE = 'cubic-bezier(.2, .9, .3, 1)';
  let stage = '';
  function snap() {
    const m = new Map();
    if (calm.matches || !app.animate) return m;
    for (const el of app.querySelectorAll('[data-k]')) m.set(el.dataset.k, { r: el.getBoundingClientRect(), sig: el.dataset.sig });
    return m;
  }
  function move(old, fresh) {
    if (calm.matches || !app.animate) return;
    // A new screen comes in a piece at a time.
    if (fresh) {
      [...app.children].forEach((el, n) => el.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: Math.min(n, 6) * 45, easing: EASE, fill: 'backwards' }));
      app.querySelectorAll('[data-fx="bar"]').forEach((el, n) => el.animate([{ transform: 'scaleY(0)' }, { transform: 'none' }], { duration: 420, delay: 160 + Math.min(n, 20) * 22, easing: EASE, fill: 'backwards' }));
      return;
    }
    const els = [...app.querySelectorAll('[data-k]')], by = new Map();
    for (const el of els) {
      const o = old.get(el.dataset.k); if (!o) continue;
      const r = el.getBoundingClientRect();
      by.set(el, { x: o.r.left - r.left, y: o.r.top - r.top, o, r });
    }
    let born = 0;
    for (const el of els) {
      const d = by.get(el), fx = el.dataset.fx;
      if (!d) {
        if (fx === 'bar') el.animate([{ transform: 'scaleY(0)' }, { transform: 'none' }], { duration: 360, easing: EASE });
        else if (!fx) el.animate([{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 240, delay: Math.min(born++, 14) * 16, easing: EASE, fill: 'backwards' });
        continue;
      }
      if (fx === 'bar') {
        if (d.r.height && Math.abs(d.o.r.height - d.r.height) > .5) el.animate([{ transform: `scaleY(${d.o.r.height / d.r.height})` }, { transform: 'none' }], { duration: 380, easing: EASE });
        continue;
      }
      // Inside something that itself moved, only the difference is this piece's own.
      const up = el.parentElement.closest('[data-k]'), u = up && by.get(up);
      const x = d.x - (u ? u.x : 0), y = d.y - (u ? u.y : 0), changed = d.o.sig !== el.dataset.sig;
      if (fx === 'tick') { if (changed) el.animate([{ opacity: 0, transform: 'translateY(70%)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: EASE }); }
      else if (fx === 'pop') { if (changed) el.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(1.9)' }, { transform: 'scaleY(1)' }], { duration: 320, easing: 'ease-out' }); }
      else if (Math.abs(x) > .5 || Math.abs(y) > .5) el.animate([{ transform: `translate(${x}px, ${y}px)` }, { transform: 'none' }], { duration: 360, easing: EASE });
      else if (changed) el.animate([{ transform: 'scale(.9)' }, { transform: 'none' }], { duration: 260, easing: EASE });
    }
  }

  // ---- Screens ----

  const chev = () => '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
  const ABOUT = `<button class="icon-btn" data-act="about" aria-label="About">${INFO}</button>`;
  const bar = () => `<header class="top"><a class="mark" href="/" data-nav>Muster</a>${ABOUT}</header>`;

  // The terms, privacy and the way to us live in About. The screens that begin
  // something say only that going on agrees to the terms.
  const agree = () => `<p class="legal">By continuing you agree to the <a href="https://teloone.au/apps/muster/terms/">terms</a>.</p>`;

  // Home asks one thing a screen. Each step is an entry in the phone's history,
  // so back, and a swipe from the edge, go to the step before.
  const step = () => (history.state && history.state.step) || '';
  let after = '';
  function toStep(s) {
    history.pushState({ step: s }, '', '/'); path = location.pathname;
    ui.bad = false; ui.code = '';
    render(); window.scrollTo(0, 0);
    const el = app.querySelector('.onb form input'); if (el) el.focus();
  }
  const stepBar = () => `<header class="top"><div class="top-left"><button class="icon-btn" data-act="back" aria-label="Back">${BACK}</button><span class="mark">Muster</span></div></header>`;
  const WEEKEND = ['fbmf', 'bfbm', 'ffff', 'mfbb', 'bmfb'];
  const weekend = () => `<div class="wk" role="img" aria-label="Four friends' answers for each part of the weekend. Saturday night suits everyone.">
      <div class="wk-grid" aria-hidden="true">${L.SLOTS.map((sl, c) => `<div class="wk-col${c === 2 ? ' best' : ''}"><b>${sl.day}<span>${sl.part}</span></b>${[...WEEKEND[c]].map((v, r) => `<i class="${v}" style="--c:${c};--r:${r}"></i>`).join('')}</div>`).join('')}</div>
      <p class="wk-say" aria-hidden="true">Saturday night suits everyone</p>
    </div>`;

  const PLUS = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>';
  // A group as the phone last saw it: this weekend, a bar a person for each slot.
  function peek(st) {
    const now = new Date(), week = L.weekKey(now), n = st.members.length, rows = Math.min(n, 8);
    const top = L.best(st, [week], now)[0];
    const cols = L.SLOTS.map((sl, i) => {
      const r = L.roll(st, week, i);
      // More than eight people share the eight bars out in proportion.
      const cut = k => Math.round(k * rows / n);
      const f = cut(r.f.length), m = Math.min(rows - f, cut(r.m.length)), b = Math.min(rows - f - m, cut(r.b.length));
      const bars = 'f'.repeat(f) + 'm'.repeat(m) + 'b'.repeat(b) + '-'.repeat(rows - f - m - b);
      return `<span class="wk-col${top && top.i === i ? ' best' : ''}"><b>${sl.day}<span>${sl.part}</span></b>${[...bars].map((v, r) => `<i class="${v === '-' ? '' : v}" style="--c:${i};--r:${r}"></i>`).join('')}</span>`;
    }).join('');
    const say = top ? (top.all ? `${L.slotName(top.i)} suits everyone` : `${L.slotName(top.i)} suits ${top.f} of ${n}`) : 'No time that suits yet';
    return { top, cols, say };
  }
  function groupCard(s) {
    const c = ls.get('muster.g.' + s.id, null), st = c && c.state;
    const head = sub => `<span class="gcard-head"><span><strong>${esc(s.name || 'Group')}</strong>${sub ? `<small>${sub}</small>` : ''}</span>${chev()}</span>`;
    if (!st || !st.members || !st.members.length) return `<a class="gcard" href="/g/${s.id}" data-nav>${head('')}</a>`;
    const n = st.members.length, { top, cols, say } = peek(st);
    return `<a class="gcard" href="/g/${s.id}" data-nav aria-label="${esc(s.name || 'Group')}. ${say}.">${head(`${n} ${n === 1 ? 'person' : 'people'} · This weekend`)}
      <span class="wk-grid" aria-hidden="true">${cols}</span><span class="wk-say${top ? '' : ' none'}" aria-hidden="true">${say}</span></a>`;
  }

  const steps = {
    welcome: () => `<div class="onb">${bar()}
      <h1 class="lead">See when everyone's free this weekend.</h1>
      ${weekend()}
      <div class="end"><button class="btn wide" data-act="step" data-s="name">Get started</button>${agree()}</div></div>`,
    groups: () => `<div class="onb"><header class="top"><a class="mark" href="/" data-nav>Muster</a><div class="top-right"><span class="top-when">${L.rangeLabel(L.weekKey(new Date()))}</span>${ABOUT}</div></header>
      <h1 class="vh">Your groups</h1>
      <nav class="gcards" aria-label="Your groups">${saved.map(groupCard).join('')}</nav>
      <div class="end groups-acts"><button class="btn" data-act="step" data-s="create">Start a group</button><button class="btn ghost" data-act="step" data-s="link">Join a group</button></div></div>`,
    name: () => `<div class="onb">${stepBar()}<div class="mid">
      <h1 class="ask">What's your name?</h1>
      <form class="stack" data-form="name" autocomplete="off">
        <input type="text" name="me" maxlength="24" aria-label="Your name" value="${esc(ls.get('muster.name', ''))}" required autocapitalize="words" autocorrect="off" enterkeyhint="next">
        <button class="btn wide">Continue</button>
      </form></div></div>`,
    choose: () => `<div class="onb">${stepBar()}<div class="mid even">
      <h1 class="ask">Start a group, or join one?</h1>
      <div class="pick">
        <button data-act="step" data-s="create"><span class="ic">${PLUS}</span><strong>Start a group</strong><small>Then send your friends the code.</small></button>
        <button data-act="step" data-s="link"><span class="eg" aria-hidden="true"><i>J</i><i>K</i><i>L</i><i>M</i></span><strong>Join a group</strong><small>With a code from a friend.</small></button>
      </div></div></div>`,
    create: () => `<div class="onb">${stepBar()}<div class="mid">
      <h1 class="ask">Name your group</h1>
      <form class="stack" data-form="create" autocomplete="off">
        <input type="text" name="group" maxlength="40" aria-label="Group name" placeholder="The Usual Suspects" required autocapitalize="words" enterkeyhint="go">
        <button class="btn wide">Start group</button>
      </form></div></div>`,
    link: () => `<div class="onb">${stepBar()}<div class="mid">
      <h1 class="ask">Enter the group's code</h1>
      <form class="stack" data-form="link" autocomplete="off">
        <label class="code-in"><input type="text" name="link" aria-label="Group code, four letters" value="${esc(ui.code || '')}" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go">${cells(ui.code || '')}</label>
        ${ui.bad ? `<p class="bad" role="alert">${BAD[ui.bad]}</p>` : ''}
        <button class="btn wide">Join</button>
      </form></div></div>`,
  };
  const cells = v => `<span class="cells" aria-hidden="true">${[0, 1, 2, 3].map(k => `<i${k === v.length ? ' class="at"' : ''}>${v[k] || ''}</i>`).join('')}</span>`;
  const BAD = { none: 'No group has that code. Codes last a week.', many: "Too many tries. Wait an hour, or open the group's link.", net: "Can't reach Muster. Check your connection." };
  const home = () => (steps[step()] || (saved.length ? steps.groups : steps.welcome))();

  const loading = () => `${bar()}<div class="lone"><p>Fetching the group.</p></div>`;
  const gone = () => {
    const [h, p] = G.why === 'none' ? ["That code doesn't lead to a group.", 'Codes last a week. Ask for a new one.']
      : G.why === 'many' ? ['Too many tries.', "Wait an hour, or open the group's link."]
      : ["This link doesn't lead to a group.", "Check it's the whole link, or ask whoever sent it."];
    return `${bar()}<div class="lone"><h1>${h}</h1><p>${p}</p><a class="btn" href="/" data-nav>Start a group</a></div>`;
  };
  const failed = () => `${bar()}<div class="lone"><h1>Can't reach Muster.</h1><p>Check your connection.</p><button class="btn" data-act="retry">Try again</button></div>`;

  // Someone opened a group's link: what it is, who's in, and this weekend so far.
  function join() {
    const s = G.state, a = s.members.map(m => m.name), n = a.length;
    const who = !n ? 'Nobody has joined yet. Be the first.'
      : n === 1 ? `${a[0]} is in.` : n <= 3 ? `${a.slice(0, -1).join(', ')} and ${a[n - 1]} are in.` : `${a[0]}, ${a[1]} and ${n - 2} others are in.`;
    const p = n ? peek(s) : null;
    return `<div class="onb inv">
      ${bar()}
      <div><p class="kick">You're invited to</p><h1 class="ask">${esc(s.group.name)}</h1><p class="who">${esc(who)}</p></div>
      ${p ? `<div class="wk" role="img" aria-label="This weekend so far. ${esc(p.say)}."><p class="wk-cap" aria-hidden="true">This weekend so far</p><div class="wk-grid" aria-hidden="true">${p.cols}</div><p class="wk-say${p.top ? '' : ' none'}" aria-hidden="true">${esc(p.say)}</p></div>` : ''}
      <div class="end">
        <form class="stack" data-form="join" autocomplete="off">
          <input type="text" name="me" maxlength="24" value="${esc(ls.get('muster.name', ''))}" required placeholder="Your name" aria-label="Your name" autocapitalize="words" autocorrect="off" enterkeyhint="done">
          <button class="btn wide">${ui.dup ? 'Join anyway' : 'Join'}</button>
          ${ui.dup ? `<p class="hint">${esc(ui.dupName)} is already here. If that's you, tap your name below.</p>` : ''}
        </form>
        ${n ? `<div class="mine"><p>Already in it? Tap your name.</p><div class="names">${s.members.map(m => `<button class="btn ghost" data-act="claim" data-id="${m.id}">${esc(m.name)}</button>`).join('')}</div></div>` : ''}
        ${agree()}
      </div></div>`;
  }

  const openSlots = (w, now = new Date()) => L.SLOTS.map((_, i) => i).filter(i => !L.isPast(w, i, now));

  function board() {
    const s = G.state, now = new Date();
    const weekList = L.weeks(now, WEEKS).slice(0, ui.more ? WEEKS : 4);
    const events = s.plans.filter(p => !L.isPast(p.w, L.planSlots(p).at(-1), now)).sort((a, b) => (a.w < b.w ? -1 : a.w > b.w ? 1 : a.i - b.i));
    return `
      <header class="top">
        <div class="top-left"><a class="icon-btn" href="/" data-nav aria-label="All your groups">${BACK}</a><div class="top-title"><h1 class="mark">${esc(s.group.name)}</h1><p class="mark-n">${s.members.length} ${s.members.length === 1 ? 'person' : 'people'}</p></div></div>
        <div class="top-right"><button class="icon-btn" data-act="invite" aria-label="Invite">${ADD}</button><button class="icon-btn" data-act="menu" aria-label="More" aria-haspopup="menu" aria-expanded="${!!ui.menu}">${DOTS}</button></div>
        ${ui.menu ? `<div class="scrim" data-act="menu"></div><div class="menu" role="menu"><button class="menu-row" role="menuitem" data-act="settings">${GEAR}<span>You and the group</span></button><button class="menu-row" role="menuitem" data-act="about">${INFO}<span>About</span></button></div>` : ''}
      </header>
      ${G.offline ? `<p class="status">Can't reach Muster. Your changes will send when you're back online.</p>` : ''}
      <section class="section">
        <div class="sec-head"><h2>Events</h2><button class="link" data-act="event">New event</button></div>
        ${events.length ? `<div class="events">${events.map(event).join('')}</div>` : `<p class="empty">No events yet.</p>`}
      </section>
      ${weekList.map(w => week(w, now)).join('')}
      ${ui.more ? '' : `<div class="more-weeks"><button class="link" data-act="more">Show later weekends</button></div>`}`;
  }

  // Where the knob sits: 0, 1 or 2, or '-' before you've answered.
  const pos = (list, v) => { const k = list.findIndex(a => a[0] === v); return k < 0 ? '-' : k; };
  // The group's answers as a strip of blocks, one a person up to twelve.
  function pips(r, n, k) {
    const gap = n > 12 ? 0 : .22, parts = [['f', r.f.length], ['m', r.m.length], ['b', r.b.length], ['', r['-'].length]];
    let x = 0, out = '';
    for (const [c, q] of parts) for (let j = 0; j < q; j++, x++) out += `<rect class="${c}" x="${x}" width="${1 - gap}" ${c === 'm' ? 'y=".5" height=".5"' : 'height="1"'}/>`; // a maybe is half as tall, so it isn't told by colour alone
    return `<svg class="pips" data-k="p:${k}" data-fx="pop" data-sig="${parts.map(p => p[1]).join('.')}" viewBox="0 0 ${n - gap} 1" width="${Math.min(n * 11 - 2, 72)}" height="6" preserveAspectRatio="none" aria-hidden="true">${out}</svg>`;
  }

  // Everyone by name, each drawn the way they answered, you first in your lot.
  // lots: [class, said aloud, members]. A big group folds away past twelve.
  const CAP = 12;
  function roster(key, lots, note) {
    const all = lots.flatMap(g => [...g[2]].sort((a, b) => (b.id === G.me) - (a.id === G.me)).map(m => [g[0], g[1], m]));
    const open = !!ui.open['r:' + key], show = open || all.length <= CAP ? all : all.slice(0, CAP - 1);
    return `<ul class="roster">${show.map(([c, said, m]) => {
      const nt = note ? note(m, c) : '';
      return `<li class="${c}${m.id === G.me ? ' me' : ''}" data-k="c:${key}:${m.id}" data-sig="${c}/${nt}"><span class="vh">${said}: </span><span class="nm">${m.id === G.me ? 'You' : esc(m.name)}</span>${nt ? `<small>${nt}</small>` : ''}</li>`;
    }).join('')}${all.length > CAP ? `<li class="more"><button data-act="all" data-key="${key}" aria-expanded="${open}">${open ? 'Less' : `+${all.length - show.length}`}</button></li>` : ''}</ul>`;
  }

  function week(w, now) {
    const s = G.state, n = s.members.length, top = L.best(s, [w], now)[0];
    const rows = openSlots(w, now).map(i => {
      const r = L.roll(s, w, i), mine = L.answer(s, G.me, w, i), open = !!ui.open[w + ':' + i], k = w + ':' + i;
      const all = n > 1 && r.f.length === n;
      const count = all ? `<span class="slot-n all"><span class="live"></span><span>Everyone's free</span></span>`
        : `<span class="slot-n">${pips(r, n, k)}<span><b data-k="n:${k}" data-fx="tick" data-sig="${r.f.length}">${r.f.length}</b> free<span class="vh"> of ${n}${r.m.length ? `, ${r.m.length} maybe` : ''}</span></span></span>`;
      const who = open ? `<div class="who-box" data-k="w:${k}">${roster(k, [['in', 'Free', r.f], ['maybe', 'Maybe', r.m], ['out', 'Busy', r.b], ['none', 'No answer', r['-']]])}<button class="link" data-act="event" data-w="${w}" data-i="${i}">New event on ${L.slotName(i)}</button></div>` : '';
      return `<div class="slot">
        <button class="slot-info" data-act="who" data-w="${w}" data-i="${i}" aria-expanded="${open}"><span class="slot-name">${L.slotName(i)}${DOWN}${!all && top && top.i === i ? `<span class="top-slot">Best</span>` : ''}</span>${count}</button>
        <div class="slide" data-pos="${pos(ANSWERS, mine.v)}" role="group" aria-label="${L.slotWhen(w, i)}, your answer"><span class="knob"></span>${ANSWERS.map(a => `<button data-act="mark" data-w="${w}" data-i="${i}" data-v="${a[0]}" aria-pressed="${mine.v === a[0]}">${a[1]}</button>`).join('')}</div>
        ${who}
      </div>`;
    }).join('');
    if (!rows) return '';
    // The weekend at a glance: a bar a slot, as tall as the share who are free.
    const sky = n > 1 ? `<span class="sky" aria-hidden="true">${L.SLOTS.map((_, i) => {
      const past = L.isPast(w, i, now), f = past ? 0 : L.roll(s, w, i).f.length;
      return `<i class="${past ? 'past' : ''}${i === 1 || i === 3 ? ' gap' : ''}"><b data-k="b:${w}:${i}" data-fx="bar" style="height:${Math.round(f / n * 100)}%"></b></i>`;
    }).join('')}</span>` : '';
    return `<section class="section" data-k="s:${w}">
      <div class="sec-head"><h2>${L.relLabel(w, now)}</h2><span class="sec-side"><span class="muted">${L.rangeLabel(w)}</span>${sky}</span></div>
      <div class="card">${rows}</div>
    </section>`;
  }

  function event(p) {
    const s = G.state, by = L.member(s, p.by), mine = p.rsvp[G.me] || '', now = new Date();
    const all = L.planSlots(p), oneDay = new Set(all.map(i => L.SLOTS[i].day)).size === 1;
    // Someone who can only make part of it has the part beside their name.
    const some = (m, c) => { const got = L.planPart(p, m.id); return c !== 'out' && c !== 'none' && got.length < all.length ? L.slotsName(got, oneDay) : ''; };
    const groups = REPLIES.map(r => [r[0], r[1], s.members.filter(m => p.rsvp[m.id] === r[0])]);
    const sure = ui.confirm === 'scrap:' + p.id;
    const got = L.planPart(p, G.me);
    const part = all.length > 1 && (mine === 'in' || mine === 'maybe') ? `<div class="ev-part${all.length > 2 ? ' long' : ''}"><span>You can make</span><div class="seg" role="group" aria-label="The parts you can make">${all.map(i => `<button data-act="part" data-p="${p.id}" data-i="${i}" aria-pressed="${got.includes(i)}">${oneDay ? L.SLOTS[i].part[0].toUpperCase() + L.SLOTS[i].part.slice(1) : L.slotName(i)}</button>`).join('')}</div></div>` : '';
    const a = L.slotDate(p.w, all[0]), b = L.slotDate(p.w, all[all.length - 1]), span = a.getTime() !== b.getTime();
    const month = d => d.toLocaleDateString('en-AU', { month: 'short' });
    const date = `<div class="ev-date${span ? ' wide' : ''}${L.key(a) === L.key(now) ? ' now' : ''}" aria-hidden="true"><b>${a.getDate()}${span ? `–${b.getDate()}` : ''}</b><span>${month(b)}</span></div>`;
    // The foot of the card: the calendar on the left once you're coming, and
    // on the right, for whoever called it, taking the event down.
    const foot = (mine === 'in' || mine === 'maybe' ? `<button class="link quiet" data-act="cal" data-p="${p.id}">Add to calendar</button>` : '')
      + (p.by === G.me || !by ? `<button class="link quiet ev-del${sure ? ' danger' : ''}" data-act="scrap" data-p="${p.id}">${sure ? 'Delete event?' : 'Delete event'}</button>` : '');
    return `<article class="card ev" data-k="e:${p.id}">
      <div class="ev-top">${date}
        <div><div class="ev-title">${esc(p.text)}</div><div class="ev-when"><span class="vh">${L.planWhen(p)}. </span><span aria-hidden="true">${L.slotsName(all)}</span>${by ? ` · by ${by.id === G.me ? 'you' : esc(by.name)}` : ''}</div></div>
      </div>
      <div class="ev-tear"></div>
      <div class="slide" data-pos="${pos(REPLIES, mine)}" role="group" aria-label="Your answer"><span class="knob"></span>${groups.map(g => `<button data-act="rsvp" data-p="${p.id}" data-v="${g[0]}" aria-pressed="${mine === g[0]}">${g[1]}${g[2].length ? `<small>${g[2].length}</small>` : ''}</button>`).join('')}</div>
      ${part}
      ${roster(p.id, [...groups, ['none', 'No answer', s.members.filter(m => !p.rsvp[m.id])]], some)}
      ${foot ? `<div class="ev-foot">${foot}</div>` : ''}
    </article>`;
  }

  function renderSheet(quiet) {
    const sh = ui.sheet;
    if (!sh || view !== 'board' && sh.kind !== 'about') { sheetRoot.innerHTML = ''; sheetDrawn = ''; document.body.style.overflow = ''; return; }
    const html = sh.kind === 'about' ? aboutSheet() : sh.kind === 'event' ? eventSheet(sh) : sh.kind === 'invite' ? inviteSheet(sh) : settingsSheet();
    if (quiet && html === sheetDrawn) return;
    sheetDrawn = html;

    el.value = v;
    ui.code = v; ui.bad = false; drawn = null;
    const box = el.parentNode.querySelector('.cells'); if (box) box.outerHTML = cells(v);
    const bad = el.form.querySelector('.bad'); if (bad) bad.remove();
    if (v.length === 4) forms.link(el.form.elements);
  });
  // Picking another weekend for an event: its past slots can't be chosen.
  document.addEventListener('change', e => {
    if (!e.target.matches('select[name=w]') || !ui.sheet) return;
    ui.sheet.w = e.target.value;
    const open = openSlots(ui.sheet.w);
    ui.sheet.sel = ui.sheet.sel.filter(i => open.includes(i));
    if (!ui.sheet.sel.length) ui.sheet.sel = [open[0]];
    renderSheet();
    const el = sheetRoot.querySelector('select[name=w]'); if (el) el.focus({ preventScroll: true });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.sheet) closeSheet();
    else if (e.key === 'Escape' && ui.menu) acts.menu();
    // On a phone the keyboard's done key puts the keyboard away. Only Post posts,
    // once the day has been looked at.
    if (e.key === 'Enter' && !e.isComposing && (shell || matchMedia('(pointer: coarse)').matches) && e.target.matches && e.target.matches('form[data-form="event"] input[name=text]')) { e.preventDefault(); e.target.blur(); }
  });
  if (shell) {
    shell.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.type === 'info') {
        if (typeof m.version === 'string') appVersion = m.version.slice(0, 20);
        // Notifications switched off in Settings: the reminder is off too.
        if (!m.notifications && remindOn()) ls.set('muster.remind', false);
        // Allowed in Settings after asking here: the reminder they wanted goes on.
        if (m.notifications && remindBlocked) { remindBlocked = false; ls.set('muster.remind', true); }
        plan(); renderSheet();
      }
      if (m.type === 'notifications') {
        if (m.allowed) { ls.set('muster.remind', true); plan(); }
        else { remindBlocked = true; toast('Notifications are off for Muster in Settings.'); }
        renderSheet();
      }
    };
    tell({ type: 'hello' });
    // Back from Settings, or from anywhere: ask again whether notifications are allowed.
    window.musterAsk = () => tell({ type: 'hello' });
  }

  route();
})();
</script>
