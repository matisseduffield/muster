<style>
/* Hanken Grotesk ships with the page (fonts/, SIL OFL). */
@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk-latin.woff2") format("woff2");
  font-weight: 400 600;
  font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk-latin-ext.woff2") format("woff2");
  font-weight: 400 600;
  font-display: swap;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

/* The family's paper and ink: sage-grey paper, near-black for what you press,
   blue for links. Green is free, amber is maybe, grey is busy. */
:root {
  --bg: #E8ECE5;
  --surface: #F7F8F4;
  --ink: #14211C;
  --muted: #5B6861;
  --line: #CDD5CC;
  --line-strong: #8C968F;
  --accent: #2C53C4;
  --pos: #1D7548;
  --neg: #B0392D;
  --mid: #8F5E0E;
  --off: #5B6861;
  --on-ink: #F7F8F4;
  --backdrop: rgba(10, 16, 14, .4);
  --font: "Hanken Grotesk", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412;
    --surface: #18211E;
    --ink: #E4EAE5;
    --muted: #8C9992;
    --line: #2E3A35;
    --line-strong: #5F6C66;
    --accent: #85A2FF;
    --pos: #5FC890;
    --neg: #F08476;
    --mid: #E3B25C;
    --off: #8C9992;
    --on-ink: #0E1412;
    --backdrop: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.muted { color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin-bottom: -6px; }
.top-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
.top-right { display: flex; align-items: center; gap: 14px; flex: none; }
.mark { font-size: 1.2rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.icon-btn {
  flex: none; display: grid; place-items: center;
  width: 44px; height: 44px; margin: 0 -8px;
  background: none; border: 0; border-radius: 50%; color: var(--muted);
}
.icon-btn:hover { color: var(--ink); }
.top-left .icon-btn { margin-left: -12px; }
.status { margin: -14px 0 -6px; font-size: .84rem; color: var(--muted); }

/* Buttons */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center;
  min-height: 46px; padding: 0 18px; border-radius: 6px;
  font-size: .95rem; font-weight: 600; text-decoration: none;
  background: var(--ink); border: 1px solid var(--ink); color: var(--on-ink);
}
.btn.ghost { background: transparent; border-color: var(--line-strong); color: var(--ink); }
.btn.wide { width: 100%; }
.link { position: relative; appearance: none; padding: 6px 0; background: none; border: 0; font-size: .88rem; font-weight: 600; color: var(--accent); text-decoration: none; }
/* Text buttons stay small on screen but take a full-size tap */
.link::after { content: ""; position: absolute; inset: -9px -6px; }
.link.quiet { color: var(--muted); font-weight: 500; }
.link.danger { color: var(--neg); }

/* Sections and cards */
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: 30px; padding: 0 2px; }
.sec-head h2 { font-size: .95rem; font-weight: 600; }
.sec-head .muted { font-size: .88rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.empty { padding: 2px 2px 0; font-size: .9rem; color: var(--muted); }

/* Three answers side by side: the one you gave is filled in */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button {
  appearance: none; min-height: 44px; padding: 0 4px; border: 0; border-left: 1px solid var(--line);
  background: none; font-size: .86rem; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }
.seg button:focus-visible { outline-offset: -3px; }
.seg small { font-size: .8rem; font-weight: 400; margin-left: 5px; opacity: .8; }

/* Your answer: a knob you drag, or tap, to one of three stops. Until you
   answer it waits in the middle, hollow, and counts for nothing. */
.slide {
  --p: 1; position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.slide[data-pos="0"] { --p: 0; --knob: var(--pos); }
.slide[data-pos="1"] { --knob: var(--mid); }
.slide[data-pos="2"] { --p: 2; --knob: var(--off); }
.knob {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 6px;
  background: var(--knob, transparent); transform: translateX(calc(var(--p) * 100%));
  transition: transform .24s cubic-bezier(.3, 1.2, .4, 1), background-color .15s;
}
.slide[data-pos="-"] .knob { outline: 1.5px dashed var(--line-strong); outline-offset: -1.5px; }
.slide.drag .knob, .slide.still .knob { transition: background-color .15s; }
.slide.drag { cursor: grabbing; }
.slide button {
  position: relative; appearance: none; min-height: 44px; padding: 0 2px; border: 0; border-radius: 6px;
  background: none; font-size: .86rem; font-weight: 500; color: var(--muted); white-space: nowrap; transition: color .15s;
}
.slide[data-pos="0"] button:nth-of-type(1), .slide[data-pos="1"] button:nth-of-type(2), .slide[data-pos="2"] button:nth-of-type(3) { color: var(--on-ink); font-weight: 600; }
.slide button:focus-visible { outline-offset: -2px; }
.slide small { font-size: .8rem; font-weight: 400; margin-left: 4px; opacity: .85; }

/* A weekend: one row for each night and day */
.slot { display: grid; grid-template-columns: minmax(0, 1fr) 174px; align-items: center; gap: 0 10px; padding: 8px 10px 8px 0; border-top: 1px solid var(--line); }
.slot:first-child { border-top: 0; }
.slot-info { appearance: none; display: grid; gap: 0; min-height: 44px; padding: 0 0 0 14px; background: none; border: 0; text-align: left; align-content: center; }
.slot-name { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.slot-name svg { color: var(--muted); transition: transform .15s; }
.slot-info[aria-expanded="true"] .slot-name svg { transform: rotate(180deg); }
.slot-n { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; font-size: .84rem; color: var(--muted); }
/* One block a person: green free, amber maybe, grey busy, pale no answer */
.pips { flex: none; display: block; fill: var(--line); }
.pips .f { fill: var(--pos); } .pips .m { fill: var(--mid); } .pips .b { fill: var(--line-strong); }
.slot-n b { font-weight: 600; color: var(--ink); }
.slot-n.all { color: var(--pos); font-weight: 600; }
.who-box { grid-column: 1 / -1; display: grid; justify-items: start; gap: 4px; padding: 6px 4px 4px 14px; }
.who { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 3px 8px; width: 100%; margin: 0; font-size: .86rem; }
.who dt { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.who dt::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 2px; background: var(--line); }
.who dt.f::before { background: var(--pos); } .who dt.m::before { background: var(--mid); } .who dt.b::before { background: var(--line-strong); }
.who dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 350px) { .slot { grid-template-columns: minmax(0, 1fr) 156px; } .slide button { font-size: .8rem; } }

/* Events */
.events { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 12px 14px 12px; }
.ev-when { font-size: .84rem; color: var(--muted); }
.ev-title { font-size: 1.05rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ev-who { font-size: .86rem; color: var(--muted); overflow-wrap: anywhere; }
.ev-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: -4px; font-size: .84rem; color: var(--muted); }

/* Sheets */
.backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 10; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; margin: 0 auto; max-width: 600px; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; outline: 0;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; padding: 6px 20px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 1rem; font-weight: 600; }
.sheet-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 18px max(20px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 480px) { .sheet-head { padding: 6px 16px; } .sheet-body { padding-left: 16px; padding-right: 16px; } }
.sheet form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.hint { font-size: .86rem; color: var(--muted); }

.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
.field-label { font-size: .8rem; font-weight: 500; color: var(--muted); }
input[type=text], select {
  width: 100%; min-height: 46px; padding: 0 12px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 6px; font-size: 16px;
}
input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input::placeholder { color: var(--muted); opacity: .8; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.seg.five button { min-height: 52px; line-height: 1.2; white-space: normal; }
.seg.five button:disabled { opacity: .35; cursor: default; }

.people { border-top: 1px solid var(--line); }
.person { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line); }
.person span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person em { font-style: normal; color: var(--muted); font-size: .86rem; }
.foot-links { display: flex; flex-wrap: wrap; gap: 6px 22px; }

/* Home and joining */
.lead { max-width: 21ch; font-size: 1.55rem; font-weight: 500; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }
.lead + p { margin-top: 10px; color: var(--muted); max-width: 34ch; }
.rows { border-top: 1px solid var(--line); }
.rows a { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 2px; border-bottom: 1px solid var(--line); text-decoration: none; font-weight: 500; color: var(--ink); }
.rows a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows a svg { color: var(--muted); flex: none; }
form.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }

/* First run: one question a screen. The screen fills the phone so the way on,
   and the small print, sit at the foot. */
.onb { display: flex; flex-direction: column; gap: 24px; min-height: calc(100dvh - 84px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.onb .lead { max-width: 16ch; font-size: 1.9rem; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
.onb .ask { font-size: 1.55rem; font-weight: 600; line-height: 1.2; letter-spacing: -.015em; }
.onb form.stack { gap: 14px; }
.onb form.stack input { min-height: 54px; font-size: 18px; }
.onb .btn { min-height: 52px; font-size: 1rem; }
.onb .end { margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.onb .groups-acts { grid-template-columns: 1fr 1fr; }
.bad { color: var(--neg); font-size: .86rem; }

/* A weekend in miniature: a bar a friend for each slot, and the slot that suits everyone. */
.wk { display: grid; gap: 14px; padding: 16px 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.wk-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.wk-col { display: grid; gap: 6px; padding: 10px 6px; border: 1.5px solid transparent; border-radius: 6px; }
.wk-col.best { border-color: var(--ink); }
.wk-col b { display: block; margin-bottom: 4px; font-size: .74rem; font-weight: 600; line-height: 1.25; text-align: center; }
.wk-col b span { display: block; font-weight: 400; color: var(--muted); }
.wk-col i { height: 16px; border-radius: 4px; background: var(--line); animation: wk-in .45s both; animation-delay: calc(var(--c) * 80ms + var(--r) * 40ms + 120ms); }
.wk-col i.f { background: var(--pos); }
.wk-col i.m { background: var(--mid); }
.wk-say { display: flex; align-items: center; gap: 8px; padding: 0 6px; font-size: .9rem; font-weight: 600; }
.wk-say::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pos); }
@keyframes wk-in { from { opacity: 0; transform: scaleX(.4); } }

/* Two tall tiles share the screen, so the choice is the page. */
.pick { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(150px, 250px); align-content: start; gap: 12px; }
.pick button { appearance: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr; gap: 0 14px; padding: 20px 18px; text-align: left; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; }
.pick button:active { background: color-mix(in srgb, var(--ink) 6%, var(--surface)); }
.pick .ic { grid-area: 1 / 1; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--on-ink); }
.pick .ic svg { width: 24px; height: 24px; }
.pick .ic + span { grid-area: 2 / 1 / 3 / -1; align-self: end; }
.pick strong { display: block; font-size: 1.4rem; font-weight: 600; line-height: 1.2; letter-spacing: -.015em; }
.pick small { display: block; margin-top: 4px; font-size: .95rem; color: var(--muted); }
.pick > button > svg { grid-area: 1 / 2; align-self: center; color: var(--muted); }

/* A group on the home screen: its weekend at a glance. */
.gcards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.gcard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 16px 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); }
.gcard:active { background: color-mix(in srgb, var(--ink) 5%, var(--surface)); }
.gcard-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 6px; }
.gcard-head strong { display: block; font-size: 1.15rem; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gcard-head small { display: block; font-size: .84rem; color: var(--muted); }
.gcard-head svg { flex: none; color: var(--muted); }
.gcard .wk-col i { height: 10px; border-radius: 3px; animation: none; }
.gcard .wk-say.none { font-weight: 400; color: var(--muted); }
.gcard .wk-say.none::before { background: var(--line-strong); }

.legal { margin-top: 4px; text-align: center; font-size: .8rem; color: var(--muted); }
.legal nav { display: flex; justify-content: center; gap: 28px; }
.legal a { display: flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: .84rem; text-decoration: none; }
.lone { display: grid; gap: 10px; justify-items: start; margin-top: 12vh; }
.lone h1 { font-size: 1.3rem; font-weight: 600; line-height: 1.3; }
.lone p { color: var(--muted); }

#toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--on-ink); border-radius: 6px; padding: 10px 14px; font-size: .9rem; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .15s; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

<script>
if ('serviceWorker' in navigator && !window.musterApp) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
<script>
(() => {
  const L = Muster;
  const app = document.getElementById('app'), sheetRoot = document.getElementById('sheet'), toastEl = document.getElementById('toast');
  const WEEKS = 8;

  // Inside the iPhone app the pages come with the app, and the app lends what a
  // page can't do alone: the share sheet, a tick under the thumb, reminders.
  const shell = window.musterApp || null;
  const SITE = shell ? 'https://muster.teloone.au' : location.origin;
  const API = shell ? SITE : '';
  const tell = m => shell.postMessage(JSON.stringify(m));

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rid = () => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const clean = (s, max) => String(s || '').replace(/\s+/g, ' ').trim().slice(0, max);
  const ls = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  const GEAR = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h9M16 6h1M3 14h1M8 14h9"/><circle cx="14" cy="6" r="2"/><circle cx="6" cy="14" r="2"/></svg>';
  const BACK = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5L7 10l5.5 5.5"/></svg>';
  const DOWN = '<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>';
  const ANSWERS = [['f', 'Free'], ['m', 'Maybe'], ['b', 'Busy']];
  const REPLIES = [['in', 'Going'], ['maybe', 'Maybe'], ['out', 'No']];

  let saved = ls.get('muster.groups', []);
  let G = null;            // the open group: { id, me, state, queue, gone, failed, offline }
  let ui = { open: {}, more: false, sheet: null, confirm: null };
  let view = '', drawn = null;

  // ---- Keeping in step with the server ----

  const persist = g => { ls.set('muster.g.' + g.id, { state: g.state, queue: g.queue }); plan(); };
  function remember(g) {
    const at = saved.findIndex(s => s.id === g.id);
    const row = { id: g.id, name: g.state ? g.state.group.name : (at >= 0 ? saved[at].name : ''), me: g.me };
    if (at >= 0) saved[at] = row; else saved.unshift(row);
    ls.set('muster.groups', saved);
    plan();
  }

  function forget(id) { saved = saved.filter(s => s.id !== id); ls.set('muster.groups', saved); ls.del('muster.g.' + id); plan(); }

  // The Thursday reminder, in the iPhone app. The phone shows it by itself: one
  // for each weekend ahead you haven't fully answered, at 6 the evening before.
  const remindOn = () => !!ls.get('muster.remind', false);
  // Notifications were refused: only the phone's Settings can turn them back on.
  let remindBlocked = false;
  let planned = '';
  function plan() {
    if (!shell) return;
    const items = [], now = Date.now();
    if (remindOn()) {
      const mine = saved.map(g => ({ g, c: ls.get('muster.g.' + g.id, null) })).filter(x => x.g.me && x.c && x.c.state);
      for (const w of L.weeks(new Date(), WEEKS)) {
        const at = L.parse(L.addDays(w, -1)); at.setHours(18, 0, 0, 0);
        if (at.getTime() <= now) continue;
        const open = mine.find(x => (((x.c.state.marks || {})[x.g.me] || {})[w] || L.BLANK).includes('-'));
        if (open) items.push({ id: 'weekend-' + w, at: at.getTime(), title: open.g.name || 'Muster', body: "Mark when you're free this weekend.", open: '/g/' + open.g.id });
      }
    }
    const next = JSON.stringify(items);
    if (next === planned) return;
    planned = next;
    tell({ type: 'notify', items });
  }

  // Changes go a slice at a time, so a long list made offline never asks too much of one request.
  const SLICE = 40;
  // The iPhone app gives the page a little longer to send when it goes out of sight.
  let owing = null;
  function owe() {
    if (!shell) return;
    const on = !!(G && G.id && G.queue.length && !G.gone && !G.left);
    if (on !== owing) { owing = on; tell({ type: 'unsent', on }); }
  }

  let busy = false, fails = 0, again = 0;
  async function sync() {
    if (!G || !G.id || busy) return;
    const g = G;
    busy = true;
    clearTimeout(again);
    let ok = false;
    try {
      const sending = g.queue.slice(0, SLICE);
      const res = sending.length
        ? await fetch(`${API}/api/g/${g.id}/ops`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ops: sending }) })
        : await fetch(`${API}/api/g/${g.id}`, { cache: 'no-store', headers: g.state && g.state.group.version ? { 'If-None-Match': `"${g.state.group.version}"` } : {} });
      if (res.status === 304) {
        ok = true;
      } else if (res.ok) {
        const fresh = await res.json();
        g.queue = g.queue.slice(sending.length);
        g.queue.forEach(op => L.applyOp(fresh, op));
        g.state = fresh;
        ok = true;
        if (!g.left) { persist(g); if (g.me) remember(g); }
      } else if (res.status === 404) {
        g.gone = true; g.queue = []; ok = true; forget(g.id);
      } else if (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429 && sending.length) {
        // The server won't take these: drop them rather than jam the queue.
        g.queue = g.queue.slice(sending.length); if (!g.left) persist(g); ok = true;
      } else throw new Error(String(res.status));
    } catch (e) {
      g.failed = true;
    }
    busy = false;
    if (g !== G) return sync();
    owe();
    const was = g.offline;
    g.offline = !ok;
    if (ok) { fails = 0; g.failed = false; } else { fails = Math.min(fails + 1, 5); again = setTimeout(sync, 1500 * 2 ** fails); }
    refresh(was !== g.offline);
    if (ok && g.queue.length) sync();
  }

  // A change: shown at once, kept until the server has it.
  function push(...ops) {
    ops.forEach(op => L.applyOp(G.state, op));
    G.queue.push(...ops);
    persist(G);
    owe();
    sync();
  }

  setInterval(() => { if (!document.hidden && G) sync(); }, 20000);
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && G) { sync(); refresh(); } });
  window.addEventListener('online', () => sync());

  // ---- Which screen ----

  function route() {
    const m = location.pathname.match(/^\/g\/([A-Za-z0-9_-]{22})\/?$/);
    ui = { open: {}, more: false, sheet: null, confirm: null };
    // A group link that's the wrong length: say so, rather than show the home screen.
    if (!m && location.pathname.startsWith('/g/')) G = { id: '', me: null, state: null, queue: [], gone: true };
    else if (!m) { G = null; }
    else {
      const id = m[1], s = saved.find(x => x.id === id), c = ls.get('muster.g.' + id, null);
      G = { id, me: s ? s.me : null, state: c ? c.state : null, queue: c && c.queue ? c.queue : [] };
      sync();
    }
    view = '';
    owe();
    render();
    renderSheet();
    window.scrollTo(0, 0);
  }
  let path = location.pathname;
  function go(to) { history.pushState(null, '', to); path = location.pathname; route(); }
  // Back closes an open sheet and stays on the board.
  window.addEventListener('popstate', () => {
    if (location.pathname === path) {
      if (ui.sheet) { ui.sheet = null; ui.confirm = null; renderSheet(); }
      else if (!G) { ui.bad = false; render(); window.scrollTo(0, 0); }
      return;
    }
    path = location.pathname; route();
  });

  const kind = () => !G ? 'home' : G.gone ? 'gone' : !G.state ? (G.failed ? 'failed' : 'loading') : (!G.me || !L.member(G.state, G.me)) ? 'join' : 'board';
  // After news from the server: redraw the board, but leave a form someone may be typing in.
  function refresh(force) {
    const k = kind();
    if (k !== view || k === 'board' || force && k !== 'home' && k !== 'join') render();
    // An open sheet keeps up too, unless someone is typing or choosing in it.
    const at = document.activeElement;
    if (ui.sheet && view === 'board' && !(at && sheetRoot.contains(at) && /^(INPUT|TEXTAREA|SELECT)$/.test(at.tagName))) renderSheet(true);
  }

  function render() {
    view = kind();
    document.title = G && G.state ? `${G.state.group.name} · Muster` : 'Muster';
    if (view !== 'board' && ui.sheet) { ui.sheet = null; renderSheet(); }
    const html = ({ home, gone, failed, loading, join, board })[view]();
    // Nothing new: leave the page alone, so focus and half-typed names survive.
    if (html === drawn) return;
    drawn = html;
    app.innerHTML = html;
  }

  // ---- Screens ----

  const chev = () => '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
  const bar = () => `<header class="top"><a class="mark" href="/" data-nav>Muster</a></header>`;

  // The iPhone app carries its own way to the terms and to us.
  const legal = () => shell ? `<div class="legal"><p>By continuing you agree to the terms.</p><nav aria-label="Legal"><a href="https://teloone.au/apps/muster/terms/">Terms</a><a href="https://teloone.au/apps/muster/privacy/">Privacy</a><a href="mailto:support@teloone.au?subject=Muster">Contact</a></nav></div>` : '';

  // Home asks one thing a screen. Each step is an entry in the phone's history,
  // so back, and a swipe from the edge, go to the step before.
  const step = () => (history.state && history.state.step) || '';
  let after = '';
  function toStep(s) {
    history.pushState({ step: s }, '', '/'); path = location.pathname;
    ui.bad = false;
    render(); window.scrollTo(0, 0);
    const el = app.querySelector('.onb form input'); if (el) el.focus();
  }
  const stepBar = () => `<header class="top"><div class="top-left"><button class="icon-btn" data-act="back" aria-label="Back">${BACK}</button><span class="mark">Muster</span></div></header>`;
  const WEEKEND = ['fbmf', 'bfbm', 'ffff', 'mfbb', 'bmfb'];
  const weekend = () => `<div class="wk" role="img" aria-label="Four friends' answers for each part of the weekend. Saturday night suits everyone.">
      <div class="wk-grid" aria-hidden="true">${L.SLOTS.map((sl, c) => `<div class="wk-col${c === 2 ? ' best' : ''}"><b>${sl.day}<span>${sl.part}</span></b>${[...WEEKEND[c]].map((v, r) => `<i class="${v}" style="--c:${c};--r:${r}"></i>`).join('')}</div>`).join('')}</div>
      <p class="wk-say" aria-hidden="true">Saturday night suits everyone</p>
    </div>`;

  const PLUS = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>';
  const LINK = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 11.5a3.2 3.2 0 0 0 4.5 0l2.6-2.6a3.2 3.2 0 0 0-4.5-4.5l-.9.9M11.5 8.5a3.2 3.2 0 0 0-4.5 0l-2.6 2.6a3.2 3.2 0 0 0 4.5 4.5l.9-.9"/></svg>';
  // A group as the phone last saw it: this weekend, a bar a person for each slot.
  function groupCard(s) {
    const c = ls.get('muster.g.' + s.id, null), st = c && c.state;
    const head = sub => `<span class="gcard-head"><span><strong>${esc(s.name || 'Group')}</strong>${sub ? `<small>${sub}</small>` : ''}</span>${chev()}</span>`;
    if (!st || !st.members || !st.members.length) return `<a class="gcard" href="/g/${s.id}" data-nav>${head('')}</a>`;
    const now = new Date(), week = L.weekKey(now), n = st.members.length, rows = Math.min(n, 8);
    const top = L.best(st, [week], now)[0];
    const cols = L.SLOTS.map((sl, i) => {
      const r = L.roll(st, week, i);
      // More than eight people share the eight bars out in proportion.
      const cut = k => Math.round(k * rows / n);
      const f = cut(r.f.length), m = Math.min(rows - f, cut(r.m.length)), b = Math.min(rows - f - m, cut(r.b.length));
      const bars = 'f'.repeat(f) + 'm'.repeat(m) + 'b'.repeat(b) + '-'.repeat(rows - f - m - b);
      return `<span class="wk-col${top && top.i === i ? ' best' : ''}"><b>${sl.day}<span>${sl.part}</span></b>${[...bars].map(v => `<i class="${v === '-' ? '' : v}"></i>`).join('')}</span>`;
    }).join('');
    const say = top ? (top.all ? `${L.slotName(top.i)} suits everyone` : `${L.slotName(top.i)} suits ${top.f} of ${n}`) : 'No time that suits yet';
    return `<a class="gcard" href="/g/${s.id}" data-nav aria-label="${esc(s.name || 'Group')}. ${say}.">${head(`${n} ${n === 1 ? 'person' : 'people'} · This weekend`)}
      <span class="wk-grid" aria-hidden="true">${cols}</span><span class="wk-say${top ? '' : ' none'}" aria-hidden="true">${say}</span></a>`;
  }

  const steps = {
    welcome: () => `<div class="onb">${bar()}
      <h1 class="lead">See when everyone's free this weekend.</h1>
      ${weekend()}
      <div class="end"><button class="btn wide" data-act="step" data-s="name">Get started</button>${legal()}</div></div>`,
    groups: () => `<div class="onb">${bar()}
      <h1 class="ask">Your groups</h1>
      <nav class="gcards" aria-label="Your groups">${saved.map(groupCard).join('')}</nav>
      <div class="end groups-acts"><button class="btn" data-act="step" data-s="create">Start a group</button><button class="btn ghost" data-act="step" data-s="link">Join a group</button></div></div>`,
    name: () => `<div class="onb">${stepBar()}
      <h1 class="ask">What's your name?</h1>
      <form class="stack" data-form="name" autocomplete="off">
        <input type="text" name="me" maxlength="24" aria-label="Your name" value="${esc(ls.get('muster.name', ''))}" required autocapitalize="words" autocorrect="off" enterkeyhint="next">
        <button class="btn wide">Continue</button>
      </form></div>`,
    choose: () => `<div class="onb">${stepBar()}
      <h1 class="ask">Start a group, or join one?</h1>
      <div class="pick">
        <button data-act="step" data-s="create"><span class="ic">${PLUS}</span><span><strong>Start a group</strong><small>Then send your friends the link.</small></span>${chev()}</button>
        <button data-act="step" data-s="link"><span class="ic">${LINK}</span><span><strong>Join a group</strong><small>With a link a friend sent you.</small></span>${chev()}</button>
      </div></div>`,
    create: () => `<div class="onb">${stepBar()}
      <h1 class="ask">Name your group</h1>
      <form class="stack" data-form="create" autocomplete="off">
        <input type="text" name="group" maxlength="40" aria-label="Group name" placeholder="The Usual Suspects" required autocapitalize="words" enterkeyhint="go">
        <button class="btn wide">Start group</button>
      </form></div>`,
    link: () => `<div class="onb">${stepBar()}
      <h1 class="ask">Paste the group's link</h1>
      <form class="stack" data-form="link" autocomplete="off">
        <input type="text" name="link" aria-label="Group link" placeholder="muster.teloone.au/g/..." required autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="url" enterkeyhint="go">
        ${ui.bad ? `<p class="bad" role="alert">That isn't a Muster group link. Paste the whole link.</p>` : ''}
        <button class="btn wide">Join</button>
      </form></div>`,
  };
  const home = () => (steps[step()] || (saved.length ? steps.groups : steps.welcome))();

  const loading = () => `${bar()}<div class="lone"><p>Fetching the group.</p></div>`;
  const gone = () => `${bar()}<div class="lone"><h1>This link doesn't lead to a group.</h1><p>Check it's the whole link, or ask whoever sent it.</p><a class="btn" href="/" data-nav>Start a group</a></div>`;
  const failed = () => `${bar()}<div class="lone"><h1>Can't reach Muster.</h1><p>Check your connection.</p><button class="btn" data-act="retry">Try again</button></div>`;

  function join() {
    const s = G.state;
    const names = s.members.length ? `<section class="section"><div class="sec-head"><h2>Already in it? Tap your name.</h2></div><div class="names">${s.members.map(m => `<button class="btn ghost" data-act="claim" data-id="${m.id}">${esc(m.name)}</button>`).join('')}</div></section>` : '';
    return `
      ${bar()}
      <div><h1 class="lead">${esc(s.group.name)}</h1><p>${s.members.length ? `${esc(L.names(s.members))} ${s.members.length === 1 ? 'is' : 'are'} marking when they're free. Add yourself.` : "Add yourself to mark when you're free."}</p></div>
      <form class="stack" data-form="join" autocomplete="off">
        <label class="field"><span class="field-label">Your name</span><input type="text" name="me" maxlength="24" value="${esc(ls.get('muster.name', ''))}" required autocapitalize="words" autocorrect="off" enterkeyhint="done"></label>
        <button class="btn wide">${ui.dup ? 'Join anyway' : 'Join'}</button>
        ${ui.dup ? `<p class="hint">Someone called ${esc(ui.dupName)} is already in this group. If that's you, tap your name below. If not, join anyway.</p>` : ''}
      </form>
      ${names}${legal()}`;
  }

  // A list of people by name, with you first and called "you".
  const people = (l, max = 6) => esc(L.names([...l].sort((a, b) => (b.id === G.me) - (a.id === G.me)).map(m => ({ name: m.id === G.me ? 'you' : m.name })), max));
  const openSlots = (w, now = new Date()) => L.SLOTS.map((_, i) => i).filter(i => !L.isPast(w, i, now));

  function board() {
    const s = G.state, now = new Date();
    const weekList = L.weeks(now, WEEKS).slice(0, ui.more ? WEEKS : 4);
    const events = s.plans.filter(p => !L.isPast(p.w, p.i, now)).sort((a, b) => (a.w < b.w ? -1 : a.w > b.w ? 1 : a.i - b.i));
    return `
      <header class="top">
        <div class="top-left"><a class="icon-btn" href="/" data-nav aria-label="All your groups">${BACK}</a><h1 class="mark">${esc(s.group.name)}</h1></div>
        <div class="top-right"><button class="link" data-act="invite">Invite</button><button class="icon-btn" data-act="settings" aria-label="You and the group">${GEAR}</button></div>
      </header>
      ${G.offline ? `<p class="status">Can't reach Muster. Your changes will send when you're back online.</p>` : ''}
      ${s.members.length < 2 ? `<p class="status">Just you so far. Tap Invite to send the group its link.</p>` : ''}
      <section class="section">
        <div class="sec-head"><h2>Events</h2><button class="link" data-act="event">New event</button></div>
        ${events.length ? `<div class="events">${events.map(event).join('')}</div>` : `<p class="empty">No events yet.</p>`}
      </section>
      ${weekList.map(w => week(w, now)).join('')}
      ${ui.more ? '' : `<div><button class="link" data-act="more">Show later weekends</button></div>`}`;
  }

  // Where the knob sits: 0, 1 or 2, or '-' before you've answered.
  const pos = (list, v) => { const k = list.findIndex(a => a[0] === v); return k < 0 ? '-' : k; };
  // The group's answers as a strip of blocks, one a person up to twelve.
  function pips(r, n) {
    const gap = n > 12 ? 0 : .22, parts = [['f', r.f.length], ['m', r.m.length], ['b', r.b.length], ['', r['-'].length]];
    let x = 0, out = '';
    for (const [c, k] of parts) for (let j = 0; j < k; j++, x++) out += `<rect class="${c}" x="${x}" width="${1 - gap}" height="1"/>`;
    return `<svg class="pips" viewBox="0 0 ${n - gap} 1" width="${Math.min(n * 11 - 2, 72)}" height="6" preserveAspectRatio="none" aria-hidden="true">${out}</svg>`;
  }

  function week(w, now) {
    const s = G.state, n = s.members.length;
    const rows = openSlots(w, now).map(i => {
      const r = L.roll(s, w, i), mine = L.answer(s, G.me, w, i), open = !!ui.open[w + ':' + i];
      const all = n > 1 && r.f.length === n;
      const count = all ? `<span class="slot-n all">Everyone's free</span>`
        : `<span class="slot-n">${pips(r, n)}<span><b>${r.f.length}</b> free<span class="vh"> of ${n}${r.m.length ? `, ${r.m.length} maybe` : ''}</span></span></span>`;
      const who = open ? `<div class="who-box"><dl class="who">${[['Free', r.f, 'f'], ['Maybe', r.m, 'm'], ['Busy', r.b, 'b'], ['No answer', r['-'], '']].filter(x => x[1].length).map(x => `<dt class="${x[2]}">${x[0]}</dt><dd>${people(x[1], 99)}</dd>`).join('')}</dl><button class="link" data-act="event" data-w="${w}" data-i="${i}">New event on ${L.slotName(i)}</button></div>` : '';
      return `<div class="slot">
        <button class="slot-info" data-act="who" data-w="${w}" data-i="${i}" aria-expanded="${open}"><span class="slot-name">${L.slotName(i)}${DOWN}</span>${count}</button>
        <div class="slide" data-pos="${pos(ANSWERS, mine.v)}" role="group" aria-label="${L.slotWhen(w, i)}, your answer"><span class="knob"></span>${ANSWERS.map(a => `<button data-act="mark" data-w="${w}" data-i="${i}" data-v="${a[0]}" aria-pressed="${mine.v === a[0]}">${a[1]}</button>`).join('')}</div>
        ${who}
      </div>`;
    }).join('');
    if (!rows) return '';
    return `<section class="section">
      <div class="sec-head"><h2>${L.relLabel(w, now)}</h2><span class="muted">${L.rangeLabel(w)}</span></div>
      <div class="card">${rows}</div>
    </section>`;
  }

  function event(p) {
    const s = G.state, by = L.member(s, p.by), mine = p.rsvp[G.me] || '';
    const groups = REPLIES.map(r => [r[0], r[1], s.members.filter(m => p.rsvp[m.id] === r[0])]);
    const whoLine = groups.filter(g => g[2].length).map(g => `${g[1]}: ${people(g[2])}.`).join(' ') || 'No answers yet.';
    const sure = ui.confirm === 'scrap:' + p.id;
    return `<div class="card ev">
      <div><div class="ev-when">${L.slotWhen(p.w, p.i)}</div><div class="ev-title">${esc(p.text)}</div></div>
      <div class="slide" data-pos="${pos(REPLIES, mine)}" role="group" aria-label="Your answer"><span class="knob"></span>${groups.map(g => `<button data-act="rsvp" data-p="${p.id}" data-v="${g[0]}" aria-pressed="${mine === g[0]}">${g[1]}${g[2].length ? `<small>${g[2].length}</small>` : ''}</button>`).join('')}</div>
      <div class="ev-who">${whoLine}</div>
      <div class="ev-foot"><span>${by ? `Posted by ${by.id === G.me ? 'you' : esc(by.name)}` : ''}</span>${p.by === G.me || !by ? `<button class="link quiet" data-act="scrap" data-p="${p.id}">${sure ? 'Tap again to delete' : 'Delete'}</button>` : ''}</div>
    </div>`;
  }

  // ---- Sheets ----

  let sheetDrawn = '';
  // quiet: only if something in it has changed.
  function renderSheet(quiet) {
    const sh = ui.sheet;
    if (!sh || view !== 'board') { sheetRoot.innerHTML = ''; sheetDrawn = ''; document.body.style.overflow = ''; return; }
    const html = sh.kind === 'event' ? eventSheet(sh) : settingsSheet();
    if (quiet && html === sheetDrawn) return;
    sheetDrawn = html;
    const y = sheetRoot.querySelector('.sheet') ? sheetRoot.querySelector('.sheet').scrollTop : 0;
    // Whatever is half typed survives the redraw, and so does the cursor.
    const fieldKey = el => el.form ? el.form.dataset.form + '/' + el.name : '';
    const typed = {}, at = document.activeElement;
    sheetRoot.querySelectorAll('form[data-form] input[type=text]').forEach(el => { if (el.value !== el.defaultValue) typed[fieldKey(el)] = el.value; });
    const focused = at && at.matches && at.matches('input[type=text]') && sheetRoot.contains(at) ? fieldKey(at) : '';
    const inside = !!at && sheetRoot.contains(at);
    sheetRoot.innerHTML = `<div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">${html}</div>`;
    document.body.style.overflow = 'hidden';
    sheetRoot.querySelectorAll('form[data-form] input[type=text]').forEach(el => {
      const k = fieldKey(el);
      if (k in typed) el.value = typed[k];
      if (k === focused) el.focus({ preventScroll: true });
    });
    sheetRoot.querySelector('.sheet').scrollTop = y;
    if (quiet && inside && !focused) sheetRoot.querySelector('.sheet').focus({ preventScroll: true });
  }
  // Opening a sheet never puts the cursor in a field, so the keyboard stays down.
  function openSheet(sh) {
    ui.sheet = sh; renderSheet(); sheetRoot.querySelector('.sheet').focus({ preventScroll: true });
    if (!(history.state && history.state.sheet)) history.pushState({ sheet: 1 }, '');
  }
  function closeSheet() { ui.sheet = null; ui.confirm = null; renderSheet(); if (history.state && history.state.sheet) history.back(); }
  const sheetHead = (t, shut = 'Done') => `<div class="sheet-head"><h2 id="sheet-title">${t}</h2><button class="link" data-act="close">${shut}</button></div>`;

  function eventSheet(sh) {
    const now = new Date(), open = openSlots(sh.w, now);
    return `${sheetHead('New event', 'Cancel')}
      <div class="sheet-body"><form data-form="event" autocomplete="off">
        <label class="field"><span class="field-label">What's on</span><input type="text" name="text" maxlength="80" placeholder="Pub at 7" required enterkeyhint="done"></label>
        <label class="field"><span class="field-label">Weekend</span><select name="w">${L.weeks(now, WEEKS).map(w => `<option value="${w}"${w === sh.w ? ' selected' : ''}>${L.relLabel(w, now)}, ${L.rangeLabel(w)}</option>`).join('')}</select></label>
        <div class="field"><span class="field-label">When</span><div class="seg five" role="group" aria-label="When">${L.SLOTS.map((sl, i) => `<button type="button" data-act="slot" data-i="${i}" aria-pressed="${sh.i === i}"${open.includes(i) ? '' : ' disabled'}>${sl.day}<br>${sl.part}</button>`).join('')}</div></div>
        <button class="btn wide">Post</button>
        <p class="hint">Everyone in the group can answer going, maybe or no. You go down as going.</p>
      </form></div>`;
  }

  function settingsSheet() {
    const s = G.state, me = L.member(s, G.me);
    const list = s.members.map(m => {
      const sure = ui.confirm === 'remove:' + m.id;
      return `<div class="person"><span>${esc(m.name)}${m.id === G.me ? ' <em>you</em>' : ''}</span>${m.id === G.me ? '' : `<button class="link quiet" data-act="remove" data-id="${m.id}">${sure ? 'Tap again to remove' : 'Remove'}</button>`}</div>`;
    }).join('');
    return `${sheetHead('You and the group')}
      <div class="sheet-body">
        <form data-form="rename-me" class="field" style="gap:6px" autocomplete="off"><label class="field-label" for="f-me">Your name</label><div class="pair"><input id="f-me" type="text" name="name" maxlength="24" value="${esc(me.name)}" required autocapitalize="words" autocorrect="off" enterkeyhint="done"><button class="btn ghost">Save</button></div></form>
        <form data-form="rename-group" class="field" style="gap:6px" autocomplete="off"><label class="field-label" for="f-group">Group name</label><div class="pair"><input id="f-group" type="text" name="name" maxlength="40" value="${esc(s.group.name)}" required autocapitalize="words" enterkeyhint="done"><button class="btn ghost">Save</button></div></form>
        <div class="field"><span class="field-label">People</span><div class="people">${list}</div></div>
        ${shell ? `<div class="field"><span class="field-label">Remind me to answer</span><div class="people"><div class="person"><span>Thursday, 6 pm</span><button class="link" data-act="remind" aria-pressed="${remindOn()}">${remindOn() ? 'Turn off' : remindBlocked ? 'Open Settings' : 'Turn on'}</button></div></div></div>` : ''}
        <div class="foot-links"><button class="link danger" data-act="leave">${ui.confirm === 'leave' ? 'Tap again to leave' : 'Leave this group'}</button>${shell ? `<a class="link quiet" href="mailto:support@teloone.au?subject=${encodeURIComponent('Report a Muster group')}&amp;body=${encodeURIComponent(`${SITE}/g/${G.id}\n\nWhat's wrong: `)}">Report this group</a>` : ''}</div>
      </div>`;
  }


  // ---- Doing things ----

  let toastTimer;
  function toast(t) { toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200); }

  // Destructive buttons want a second tap; the first one arms them for a few seconds.
  let confirmTimer;
  function sure(key) {
    if (ui.confirm === key) { ui.confirm = null; clearTimeout(confirmTimer); return true; }
    ui.confirm = key;
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => {
      ui.confirm = null; render();
      // Drawing the sheet again would take the keyboard away mid-word.
      const at = document.activeElement;
      if (!(at && sheetRoot.contains(at) && /^(INPUT|TEXTAREA|SELECT)$/.test(at.tagName))) renderSheet();
    }, 4000);
    return false;
  }

  // Hand a message and the group's link to the share sheet, or copy them.
  async function send(text) {
    const url = `${SITE}/g/${G.id}`;
    if (shell) return tell({ type: 'share', title: G.state.group.name, text: `${text}\n${url}` });
    const copy = async () => { try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (x) { toast("Couldn't copy the link."); } };
    if (!navigator.share) return copy();
    try { await navigator.share({ title: G.state.group.name, text, url }); } catch (e) { if (e && e.name !== 'AbortError') await copy(); }
  }

  const acts = {
    // Your answer for a slot. Tapping the one you gave takes it back.
    mark(d) {
      const i = +d.i, said = ((G.state.marks[G.me] || {})[d.w] || L.BLANK)[i];
      if (!(d.set && said === d.v)) push({ t: 'mark', m: G.me, w: d.w, i, v: said === d.v ? '-' : d.v });
      // A drag has ticked on its way; a tap gets its own.
      if (shell && !d.set) tell({ type: 'haptic', kind: 'tick' });
      render();
      const el = app.querySelector(`[data-act="mark"][data-w="${d.w}"][data-i="${i}"][data-v="${d.v}"]`);
      if (el) { el.focus({ preventScroll: true }); glide(el.parentNode, d.from != null ? d.from : pos(ANSWERS, said)); }
    },
    who(d) {
      const k = d.w + ':' + d.i;
      ui.open[k] = !ui.open[k]; render();
      const el = app.querySelector(`[data-act="who"][data-w="${d.w}"][data-i="${d.i}"]`); if (el) el.focus({ preventScroll: true });
    },
    more() { ui.more = true; render(); },
    // From the top it starts on this weekend; from a slot, on that slot.
    event(d) {
      const now = new Date(), w = d.w || L.weeks(now, 2).find(x => openSlots(x, now).length);
      openSheet({ kind: 'event', w, i: d.i != null ? +d.i : openSlots(w, now)[0] });
    },
    slot(d) { ui.sheet.i = +d.i; renderSheet(); const el = sheetRoot.querySelector(`[data-act="slot"][data-i="${d.i}"]`); if (el) el.focus({ preventScroll: true }); },
    rsvp(d) {
      const p = G.state.plans.find(x => x.id === d.p); if (!p) return;
      const said = p.rsvp[G.me] || '';
      if (!(d.set && said === d.v)) push({ t: 'rsvp', p: d.p, m: G.me, v: said === d.v ? '' : d.v });
      if (shell && !d.set) tell({ type: 'haptic', kind: 'tick' });
      render();
      const el = app.querySelector(`[data-act="rsvp"][data-p="${d.p}"][data-v="${d.v}"]`);
      if (el) { el.focus({ preventScroll: true }); glide(el.parentNode, d.from != null ? d.from : pos(REPLIES, said)); }
    },
    scrap(d) { if (sure('scrap:' + d.p)) push({ t: 'plan', id: d.p, deleted: true }); render(); },
    invite() {
      // A group started offline has no link to open until the server has it.
      if (!G.state.group.version) { sync(); return toast("Group not sent yet. Invite once you're online."); }
      send(`${G.state.group.name}: mark when you're free`);
    },
    settings() { openSheet({ kind: 'settings' }); },
    close() { closeSheet(); },
    remove(d) { if (sure('remove:' + d.id)) push({ t: 'member', id: d.id, removed: true }); render(); renderSheet(); },
    leave() {
      if (!sure('leave')) return renderSheet();
      const g = G;
      g.left = true;
      const ops = [...g.queue, { t: 'member', id: g.me, removed: true }];
      (async () => {
        for (let k = 0; k < ops.length; k += SLICE) await fetch(`${API}/api/g/${g.id}/ops`, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ops: ops.slice(k, k + SLICE) }) });
      })().catch(() => {});
      forget(g.id);
      go('/');
    },
    claim(d) { G.me = d.id; remember(G); render(); },
    remind() {
      if (!remindOn()) return tell({ type: remindBlocked ? 'openSettings' : 'askNotifications' });
      ls.set('muster.remind', false); plan(); renderSheet();
    },
    retry() { G.failed = false; render(); sync(); },
    // Starting a group needs your name first.
    step(d) {
      if (d.s === 'create' && !ls.get('muster.name', '')) { after = 'create'; return toStep('name'); }
      toStep(d.s);
    },
    back() { history.back(); },
  };


  const forms = {
    name(f) {
      const mine = clean(f.me.value, 24);
      if (!mine) return;
      ls.set('muster.name', mine);
      const next = after || 'choose'; after = '';
      toStep(next);
    },
    // The whole link, or just the end of it.
    link(f) {
      const m = f.link.value.trim().match(/(?:^|\/g\/)([A-Za-z0-9_-]{22})\/?(?:[?#].*)?$/);
      if (!m) { ui.bad = true; render(); const el = app.querySelector('input[name=link]'); if (el) el.focus(); return; }
      go('/g/' + m[1]);
    },
    create(f) {
      const name = clean(f.group.value, 40), mine = clean(ls.get('muster.name', ''), 24);
      if (!name || !mine) return;
      const id = rid(), me = rid();
      const g = { id, me, state: { group: { id, name, version: 0 }, members: [], marks: {}, plans: [] }, queue: [] };
      [{ t: 'group', name }, { t: 'member', id: me, name: mine }].forEach(op => { L.applyOp(g.state, op); g.queue.push(op); });
      persist(g); remember(g);
      go('/g/' + id);
    },
    join(f) {
      const mine = clean(f.me.value, 24);
      if (!mine) return;
      ls.set('muster.name', mine);
      const twin = G.state.members.find(m => m.name.toLowerCase() === mine.toLowerCase());
      if (twin && ui.dup !== mine.toLowerCase()) { ui.dup = mine.toLowerCase(); ui.dupName = twin.name; return render(); }
      G.me = rid();
      push({ t: 'member', id: G.me, name: mine });
      remember(G); render();
    },
    'rename-me'(f) {
      const name = clean(f.name.value, 24);
      if (!name) return;
      if (name && name !== L.member(G.state, G.me).name) { push({ t: 'member', id: G.me, name }); ls.set('muster.name', name); render(); }
      f.name.blur(); renderSheet(); toast('Saved');
    },
    'rename-group'(f) {
      const name = clean(f.name.value, 40);
      if (!name) return;
      if (name && name !== G.state.group.name) { push({ t: 'group', name }); remember(G); render(); }
      f.name.blur(); renderSheet(); toast('Saved');
    },
    event(f) {
      const text = clean(f.text.value, 80), sh = ui.sheet;
      if (!text || sh.i == null) return;
      const id = rid();
      push({ t: 'plan', id, w: sh.w, i: sh.i, text, by: G.me }, { t: 'rsvp', p: id, m: G.me, v: 'in' });
      closeSheet(); render();
    },
  };

  // The page is redrawn after every answer, so the new knob starts where the
  // old one was and slides from there.
  function glide(el, from) {
    const p = from === '-' ? 1 : +from;
    el.classList.add('still'); el.style.setProperty('--p', p);
    el.offsetWidth;
    el.classList.remove('still'); el.style.removeProperty('--p');
  }

  // Dragging the knob. A plain tap falls through to the click below.
  let drag = null, dragged = 0;
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('.slide');
    if (!el || (e.pointerType === 'mouse' && e.button)) return;
    const r = el.getBoundingClientRect();
    drag = { el, id: e.pointerId, x: e.clientX, y: e.clientY, left: r.left + 3, step: (r.width - 6) / 3, on: false, was: el.dataset.pos, p: 1 };
  });
  document.addEventListener('pointermove', e => {
    const g = drag; if (!g || e.pointerId !== g.id) return;
    if (!g.on) {
      const dx = Math.abs(e.clientX - g.x), dy = Math.abs(e.clientY - g.y);
      if (dx < 7 || dx < dy) return;
      g.on = true; g.el.classList.add('drag');
      try { g.el.setPointerCapture(g.id); } catch (_) {}
    }
    g.p = Math.max(0, Math.min(2, (e.clientX - g.left) / g.step - .5));
    const k = String(Math.round(g.p));
    if (k !== g.el.dataset.pos) { g.el.dataset.pos = k; if (shell) tell({ type: 'haptic', kind: 'tick' }); else if (navigator.vibrate) navigator.vibrate(6); }
    g.el.style.setProperty('--p', g.p);
  });
  const drop = e => {
    const g = drag; if (!g || e.pointerId !== g.id) return;
    drag = null;
    if (!g.on) return;
    dragged = Date.now();
    const b = e.type === 'pointerup' && g.el.querySelectorAll('button')[Math.round(g.p)];
    if (b && document.contains(b)) return acts[b.dataset.act]({ ...b.dataset, set: '1', from: g.p });
    g.el.classList.remove('drag'); g.el.style.removeProperty('--p'); g.el.dataset.pos = g.was;
  };
  document.addEventListener('pointerup', drop);
  document.addEventListener('pointercancel', drop);

  document.addEventListener('click', e => {
    if (Date.now() - dragged < 350 && e.target.closest('.slide')) return;
    const nav = e.target.closest('a[data-nav]');
    if (nav && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); return go(nav.getAttribute('href')); }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = acts[el.dataset.act];
    if (act) act(el.dataset);
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    forms[f.dataset.form](f.elements);
  });
  // Picking another weekend for an event: its past slots can't be chosen.
  document.addEventListener('change', e => {
    if (!e.target.matches('select[name=w]') || !ui.sheet) return;
    ui.sheet.w = e.target.value;
    const open = openSlots(ui.sheet.w);
    if (!open.includes(ui.sheet.i)) ui.sheet.i = open[0];
    renderSheet();
    const el = sheetRoot.querySelector('select[name=w]'); if (el) el.focus({ preventScroll: true });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.sheet) closeSheet();
    // On a phone the keyboard's done key puts the keyboard away. Only Post posts,
    // once the day has been looked at.
    if (e.key === 'Enter' && !e.isComposing && (shell || matchMedia('(pointer: coarse)').matches) && e.target.matches && e.target.matches('form[data-form="event"] input[name=text]')) { e.preventDefault(); e.target.blur(); }
  });
  if (shell) {
    shell.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.type === 'info') {
        // Notifications switched off in Settings: the reminder is off too.
        if (!m.notifications && remindOn()) ls.set('muster.remind', false);
        // Allowed in Settings after asking here: the reminder they wanted goes on.
        if (m.notifications && remindBlocked) { remindBlocked = false; ls.set('muster.remind', true); }
        plan(); renderSheet();
      }
      if (m.type === 'notifications') {
        if (m.allowed) { ls.set('muster.remind', true); plan(); }
        else { remindBlocked = true; toast('Notifications are off for Muster in Settings.'); }
        renderSheet();
      }
    };
    tell({ type: 'hello' });
    // Back from Settings, or from anywhere: ask again whether notifications are allowed.
    window.musterAsk = () => tell({ type: 'hello' });
  }

  route();
})();
</script>
</body>
</html>
